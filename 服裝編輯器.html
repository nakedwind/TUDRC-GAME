<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>服裝編輯器｜Y102 應變中心</title>
<link rel="stylesheet" href="css/ui-feedback.css">
<style>
  :root { color-scheme:dark; font-family:system-ui,'Microsoft JhengHei',sans-serif; background:#10151c; color:#e8edf5 }
  * { box-sizing:border-box } body { max-width:1400px; margin:0 auto; padding:20px 24px }
  h1 { font-size:22px; margin:0 } h2 { font-size:13px; margin:0; color:#8fb3c9; font-weight:600; letter-spacing:1px }
  p { color:#aabacc; line-height:1.5; margin:0 } a { color:#9bd2ff } code { color:#ffd9a8 }
  .top { display:flex; justify-content:space-between; gap:14px; align-items:baseline; margin-bottom:14px }
  .top p { font-size:13px }
  .layout { display:grid; grid-template-columns:290px minmax(380px,1fr) 330px; gap:12px; align-items:start }
  .panel { background:#18212b; border:1px solid #2f4152; border-radius:12px; padding:14px; min-width:0 }
  button { cursor:pointer; font:inherit; font-size:13px; color:#eaf4ff; background:#24364a; border:1px solid #46617a; border-radius:7px; padding:6px 10px }
  button:hover { background:#2f4a62 } button.primary { background:#236b79; border-color:#69b9c1 } button.on { background:#245668; border-color:#7fd7da }
  button:disabled { opacity:.4; cursor:default }
  input,select { background:#101923; border:1px solid #455d72; border-radius:7px; color:#edf5ff; font:inherit; font-size:13px; padding:6px 8px; min-width:0 }
  input[type=number] { width:100% } input[type=checkbox],input[type=radio] { accent-color:#6bdbbd }
  [hidden] { display:none!important }

  /* ---- 左：角色頭像格、配件分頁＋圖示格 ---- */
  .pick { display:flex; flex-direction:column; gap:10px; position:sticky; top:12px; max-height:calc(100vh - 24px) }
  #charList { display:grid; grid-template-columns:repeat(auto-fill,minmax(46px,1fr)); gap:5px; max-height:216px; overflow-x:hidden; overflow-y:auto; scrollbar-width:thin; scrollbar-color:#3d5a72 transparent; padding:2px }
  #charList button { position:relative; display:grid; justify-items:center; gap:2px; padding:4px 2px 3px; background:#121b25; border-color:#26384a; font-size:11px; color:#b9cad9 }
  #charList button.on { background:#1f4053; border-color:#7fd7da; color:#fff }
  #charList .face { width:40px; height:40px; overflow:hidden; border-radius:6px; background:#0b131b; position:relative }
  #charList .face img { position:absolute; width:80px; height:80px; left:-20px; top:-5px; image-rendering:pixelated }
  #charList button span:last-child { max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .dot { position:absolute; top:3px; right:3px; width:7px; height:7px; border-radius:50%; background:#8be0c2 } .dot.anchor { background:#6fa8c9 }
  .tabs { display:flex; flex-wrap:wrap; gap:4px }
  .tabs button { padding:4px 9px; font-size:12px; border-radius:999px; background:#121b25; border-color:#2f4152; color:#b9cad9 }
  .tabs button.on { background:#245668; border-color:#7fd7da; color:#fff } .tabs i { font-style:normal; color:#7f98ad; margin-left:3px }
  #accSearch { width:100% }
  #accList { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; overflow:auto; min-height:120px; flex:1 1 auto; align-content:start; scrollbar-width:thin; scrollbar-color:#3d5a72 transparent; padding:2px }
  #accList button { position:relative; display:grid; justify-items:center; gap:4px; padding:8px 4px 6px; background:#121b25; border-color:#26384a; font-size:11px; color:#c7d6e3; line-height:1.25 }
  #accList button.on { background:#1f4053; border-color:#7fd7da; color:#fff }
  #accList .icon { width:44px; height:44px; display:grid; place-items:center; border-radius:6px; background:#0b131b }
  #accList .icon img { max-width:40px; max-height:40px; image-rendering:pixelated; transform:scale(1.5) }
  #accList small { color:#7f98ad; font-size:10px }
  #accList .empty { grid-column:1/-1; text-align:center; font-size:12px; color:#6d8395; padding:16px 0 }

  /* ---- 中：工具列＋預覽 ---- */
  .toolbar { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; margin-bottom:10px }
  .seg { display:inline-flex; border:1px solid #46617a; border-radius:8px; overflow:hidden }
  .seg button { border:0; border-radius:0; background:#1b2a39; padding:6px 11px } .seg button + button { border-left:1px solid #34495d }
  .seg button.on { background:#245668 } .seg button:hover { background:#2a4157 }
  .toolbar label { display:flex; gap:6px; align-items:center; font-size:13px; color:#b9cad9 }
  .toolbar .grow { flex:1 }
  .stage { display:grid; place-items:center; padding:10px; border:1px solid #2f4152; border-radius:10px; background:#0d141b }
  #stage { display:block; image-rendering:pixelated; cursor:move; touch-action:none; max-width:100% }
  .strip { display:flex; justify-content:center; gap:10px; margin-top:10px }
  .strip canvas { width:min(104px,calc(25% - 8px)); height:auto; aspect-ratio:1; image-rendering:pixelated; background:#0d141b; border:1px solid #2a3c4e; border-radius:8px; cursor:pointer }
  .strip canvas.on { border-color:#7fd7da }
  .keys { margin-top:10px; font-size:12px; color:#7f98ad; text-align:center } .keys b { color:#b9cad9; font-weight:600 }

  /* ---- 右：位置（常用）＋折疊區 ---- */
  .settings { display:flex; flex-direction:column; gap:10px }
  #editTitle { font-size:15px; color:#e8edf5; letter-spacing:0 }
  .scope { display:flex } .scope label { flex:1; cursor:pointer } .scope input { display:none }
  .scope span { display:block; text-align:center; padding:6px 4px; font-size:12px; border:1px solid #46617a; background:#1b2a39; color:#b9cad9 }
  .scope label:first-child span { border-radius:7px 0 0 7px } .scope label:last-child span { border-radius:0 7px 7px 0; border-left:0 }
  .scope input:checked + span { background:#245668; border-color:#7fd7da; color:#fff }
  .from { font-size:12px; padding:6px 9px; border-radius:7px; background:#122030; color:#a9c5da; line-height:1.5 } .from b { color:#ffd9a8 }
  .form { display:grid; grid-template-columns:repeat(4,1fr); gap:6px }
  .form label { display:grid; gap:3px; color:#8fa6ba; font-size:11px }
  .checks { display:flex; flex-wrap:wrap; gap:6px 14px; font-size:13px } .checks label { display:flex; gap:6px; align-items:center }
  .actions { display:flex; flex-wrap:wrap; gap:6px }
  details { border-top:1px solid #2a3b4c; padding-top:8px }
  summary { cursor:pointer; list-style:none; font-size:13px; font-weight:600; color:#cfe0ee; padding:2px 0; display:flex; align-items:center; gap:6px }
  summary::-webkit-details-marker { display:none } summary::before { content:'▸'; color:#7fd7da; width:12px } details[open] summary::before { content:'▾' }
  summary small { font-weight:normal; color:#7f98ad }
  details > .body { display:grid; gap:8px; margin-top:8px }
  .layer { display:flex; flex-wrap:wrap; align-items:center; gap:6px } .layer input { width:64px }
  #layerNote { font-size:12px; color:#8fb3c9 } #layerOrder b { font-weight:normal } #layerOrder b.me { color:#ffd36f; font-weight:bold }
  .copy-acc { padding:8px 9px; border:1px solid #2a3c4e; border-radius:8px; background:#121d29; font-size:12px }
  .copy-acc p { color:#a9c5da } .copy-acc b { color:#ffd9a8 }
  #copyAccList { display:flex; flex-wrap:wrap; gap:3px 12px; margin:6px 0 8px; max-height:120px; overflow:auto } #copyAccList label { display:flex; gap:5px; align-items:center; font-size:12px }
  .sub { font-size:12px; color:#8fa6ba; margin-top:2px }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:6px } .two label { display:grid; gap:3px; color:#8fa6ba; font-size:11px }
  .bob { display:grid; grid-template-columns:auto 1fr 1fr; gap:5px 8px; align-items:center; font-size:12px; color:#8fa6ba }
  .save { border-top:1px solid #2a3b4c; padding-top:10px }
  .status { min-height:18px; color:#8be0c2; font-size:12px; margin-top:6px } .status.error { color:#ff9b9b }
  @media(max-width:1180px) { .layout { grid-template-columns:270px 1fr } .settings { grid-column:1/-1 } .pick { position:static; max-height:none } }
  @media(max-width:820px) { body { padding:14px } .layout { grid-template-columns:1fr } }
</style>
</head>
<body>
  <div class="top"><div><h1>👗 服裝編輯器</h1></div><p>調配件戴在每個角色、每個方向的位置</p></div>
  <div class="layout">
    <section class="panel pick">
      <h2>角色</h2>
      <div id="charList"></div>
      <h2>配件</h2>
      <div class="tabs" id="slotTabs"></div>
      <input id="accSearch" type="search" placeholder="搜尋配件名稱…" autocomplete="off">
      <div id="accList"></div>
    </section>
    <section class="panel">
      <div class="toolbar"><div class="seg" id="dirBar"></div><div class="seg" id="frameBar"></div></div>
      <div class="toolbar">
        <label>服裝 <select id="skinSel" title="換預覽用的身體（服裝本身沒有位置可以調）"></select></label>
        <span class="grow"></span>
        <label title="同時戴著其他欄位選過的配件，方便看誰蓋誰"><input type="checkbox" id="others" checked>一起戴上其他配件</label>
      </div>
      <div class="stage"><canvas id="stage" width="448" height="448" aria-label="配件位置預覽"></canvas></div>
      <div class="strip" id="strip"></div>
      <p class="keys"><b>拖曳</b> 移動　<b>滾輪 / + −</b> 縮放　<b>Q E</b> 旋轉　<b>方向鍵</b> 微調（Shift 0.5px）　<b>1–4</b> 方向　<b>空白</b> 走路動畫</p>
    </section>
    <section class="panel settings">
      <h2 id="editTitle">位置</h2>
      <div class="scope">
        <label title="只有這個配件、這個角色用"><input type="radio" name="scope" value="item" checked><span>只調<b id="scopeItemName">這個配件</b></span></label>
        <label title="這個角色同欄位所有配件的預設位置；新配件沒調過就戴這裡"><input type="radio" name="scope" value="anchor"><span><b id="scopeAnchorName">這類預設</b></span></label>
      </div>
      <div class="from" id="fromNote"></div>
      <div class="form">
        <label>X<input id="fx" type="number" step="0.5"></label>
        <label>Y<input id="fy" type="number" step="0.5"></label>
        <label>縮放<input id="fscale" type="number" step="0.05" min="0.1"></label>
        <label>旋轉°<input id="frot" type="number" step="5"></label>
      </div>
      <div class="checks"><label><input id="fbehind" type="checkbox">在角色後面</label><label><input id="fhidden" type="checkbox">這方向不顯示</label><label><input id="fflip" type="checkbox">左右翻轉</label></div>
      <div class="actions"><button type="button" id="mirror">⇋ 左右對調</button><button type="button" id="clearDir">清除這個方向</button></div>

      <details data-key="layer">
        <summary>圖層 <small id="layerNote"></small></summary>
        <div class="body">
          <div class="layer">
            <input id="flayer" type="number" step="1" title="同時戴好幾個配件時，數字大的蓋在上面（所有角色、所有方向共用）。預設：下身 1、背部 2、手持 3、頭飾 4、臉部 5">
            <button type="button" id="layerUp" title="蓋到別的配件上面">↑ 上一層</button><button type="button" id="layerDown" title="被別的配件蓋住">↓ 下一層</button><button type="button" id="layerReset">預設</button>
          </div>
          <p class="from" id="layerOrder"></p>
        </div>
      </details>

      <details data-key="copy">
        <summary>複製與清除</summary>
        <div class="body">
          <div class="actions">
            <button type="button" id="copyAllDirs" title="把這個方向的縮放、旋轉複製到其他三個方向">縮放旋轉 → 其他方向</button>
            <button type="button" id="copyChars" title="把這個角色四個方向的設定複製給所有角色（自動加上身高偏移）">→ 所有角色</button>
            <button type="button" id="clearChar">清除這個角色</button>
          </div>
          <div class="copy-acc" id="copyAccBox">
            <p>把<b id="copyAccFrom"></b>在所有角色的專屬位置複製給：</p>
            <div id="copyAccList"></div>
            <button type="button" id="copyAcc">複製給勾選的配件</button>
          </div>
        </div>
      </details>

      <details data-key="char">
        <summary>角色設定 <small id="offWho"></small></summary>
        <div class="body">
          <div class="checks"><label><input id="fblock" type="checkbox"><span><b id="blockWho"></b>不能擁有<b id="blockAcc"></b></span></label></div>
          <div class="from" id="blockNote" hidden>⛔ 衣櫃不會列出、不能送給他，身上有也不會顯示。</div>
          <p class="sub" title="矮的角色 Y 填正數（往下）、高的填負數。「→ 所有角色」會自動加上兩個角色的偏移差；還沒調過的配件也會套用。">身高偏移（px）</p>
          <div class="two"><label>X<input id="offx" type="number" step="0.5"></label><label>Y<input id="offy" type="number" step="0.5"></label></div>
          <div class="actions"><button type="button" id="offAuto">自動偵測</button><button type="button" id="offAutoAll">全部角色</button></div>
          <p class="sub" title="走路那兩張圖的頭如果有上下晃，配件跟著位移。每個角色、每個方向一組，所有配件共用。">走路時頭的位移（<span id="bobWho"></span>・<span id="bobDir"></span>）</p>
          <div class="bob">
            <span></span><span>X</span><span>Y</span>
            <span>走路 1</span><input id="b1x" type="number" step="1"><input id="b1y" type="number" step="1">
            <span>走路 2</span><input id="b2x" type="number" step="1"><input id="b2y" type="number" step="1">
          </div>
          <div class="actions"><button type="button" id="bobAuto">自動偵測</button><button type="button" id="bobAutoAll">全部角色</button></div>
        </div>
      </details>

      <div class="save">
        <div class="actions"><button type="button" id="previewGame" title="用瀏覽器裡的設定打開遊戲預覽">▶ 遊戲預覽</button><button type="button" id="exportFile" class="primary" title="下載並取代 data/costume-placement.js">下載設定檔</button><button type="button" id="resetFile" title="丟掉瀏覽器裡的編輯，改用 data/costume-placement.js">從檔案重載</button></div>
        <div id="status" class="status" role="status"></div>
      </div>
    </section>
  </div>
  <script src="data/characters.js?v=colynparry-20261023"></script>
  <script src="data/costumes.js?v=maid-headdress-20261023"></script>
  <script src="data/costume-placement.js?v=maid-headdress-20261023"></script>
  <script src="js/draft-sync.js?v=sync-20261021"></script>
  <script src="js/costume-draw.js?v=costume-char-20261023"></script>
  <script src="js/sfx.js?v=mouse-dizzy3-20261023"></script>
  <script src="js/ui-feedback.js"></script>
  <script src="js/project-save.js?v=sync-20261021"></script>
  <script src="js/costume-editor.js?v=clean-20261023"></script>
  <script>ProjectSave.attach({
    after: ['exportFile'],
    files: [{ path: 'data/costume-placement.js', label: '配件位置', text: () => costumePlacementText() }],
    status: (m, e) => status(m, e),
  });</script>
  <script src="js/editor-nav.js?v=achv-20261023"></script>   <!-- 最上方的編輯器入口（所有編輯器共用） -->
</body>
</html>
