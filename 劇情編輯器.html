<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>劇情編輯器｜Y102 應變中心</title>
<link rel="stylesheet" href="css/ui-feedback.css">
<style>
  :root { color-scheme: dark; font-family: system-ui, 'Microsoft JhengHei', sans-serif; background: #10151c; color: #e8edf5; }
  * { box-sizing: border-box; } body { margin: 0 auto; padding: 12px 16px 16px; max-width: 2000px; }
  h1 { font-size: 22px; margin: 0 0 4px; } h2 { font-size: 15px; margin: 0 0 8px; } p { margin: 0; color: #aabacc; line-height: 1.5; }
  /* 標題列只佔一行，把高度留給下面的編輯區 */
  .top { margin-bottom: 8px; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
  .top h1 { margin: 0; font-size: 20px; } .top .grow { flex: 1; }
  .top .status { margin: 0; text-align: right; }
  details.group { border: 1px solid #2f3e4d; border-radius: 9px; background: #15202b; margin-bottom: 6px; }
  details.group > summary { cursor: pointer; padding: 7px 10px; font-size: 13px; font-weight: 700; color: #cfe0ee; }
  details.group > summary small { font-weight: 400; color: #8c98a6; margin-left: 6px; }
  details.group > div { padding: 0 10px 10px; }
  details.addmenu { margin: 6px 0 2px; } details.addmenu > summary { display: inline-block; cursor: pointer; font-size: 12px; padding: 3px 10px; border: 1px dashed #69b9c1; border-radius: 7px; color: #9fe3ea; list-style: none; }
  details.addmenu > summary::-webkit-details-marker { display: none; } details.addmenu[open] > summary { background: #1d3640; }
  .addmenu-body { margin-top: 6px; padding: 8px; border: 1px solid #3a4d60; border-radius: 8px; background: #101923; display: grid; gap: 6px; }
  .mgroup { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; } .mgroup > small { width: 56px; color: #8c98a6; font-size: 11px; }
  .addobj { margin-top: 8px; }
  /* 版面跟「劇情編輯器（改）」一樣：左＝放到地圖上的按鈕、中＝地圖預覽窗、右＝劇情／場上物件／對話；整頁高度固定，各區自己捲動 */
  .layout { display: grid; grid-template-columns: 230px minmax(0, 1fr) 600px; gap: 10px; height: calc(100vh - 118px); min-height: 560px; }
  .panel { background: #1b2530; border: 1px solid #3a4d60; border-radius: 12px; padding: 10px; min-width: 0; min-height: 0; }
  /* 左邊：放到地圖上的按鈕（每一區都可以收起來） */
  .tools { overflow: auto; display: grid; gap: 8px; align-content: start; }
  details.fold { border: 1px solid #2f3e4d; border-radius: 9px; background: #15202b; }
  details.fold > summary { cursor: pointer; padding: 7px 10px; font-weight: 700; color: #cfe0ee; list-style: none; display: flex; align-items: center; gap: 6px; font-size: 14px; }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary::after { content: '▾'; margin-left: auto; color: #8c98a6; transition: rotate .15s; }
  details.fold:not([open]) > summary::after { rotate: -90deg; }
  details.fold > summary small { font-weight: 400; font-size: 11px; color: #8c98a6; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 0 8px 9px; }
  .btns button { padding: 7px 4px; font-size: 13px; } .btns button b { color: #9fe3ea; }
  details.fold > .list { padding: 0 8px 9px; }
  /* 中間：預覽窗 */
  .stagebox { display: flex; flex-direction: column; gap: 6px; }
  /* 右邊 */
  .side { display: flex; flex-direction: column; gap: 8px; }
  .box { border: 1px solid #2f3e4d; border-radius: 9px; background: #15202b; padding: 7px 8px; }
  .box-head { display: flex; align-items: center; gap: 6px; font-weight: 700; color: #cfe0ee; font-size: 13px; }
  .box-head .grow { flex: 1; }
  .scenebar { display: grid; grid-template-columns: auto minmax(0, 1fr) auto 130px auto auto; gap: 5px; align-items: center; font-size: 13px; }
  .scenebar label { color: #cfe0ee; font-weight: 700; white-space: nowrap; }
  .settings { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 5px 8px; align-items: center; margin-top: 7px; font-size: 12px; color: #b9cad9; }
  .objs { margin-top: 2px; max-height: 120px; overflow: auto; }
  .objs .sub { margin: 4px 0 2px !important; } .objs .item { padding: 2px 8px; }
  .work { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
  .panes { flex: 1; min-height: 0; overflow: auto; padding-right: 2px; }
  button { cursor: pointer; font: inherit; color: #eaf4ff; background: #2a3c50; border: 1px solid #57718b; border-radius: 7px; padding: 5px 10px; }
  button:hover { background: #345169; } button.primary { background: #236b79; border-color: #69b9c1; } button.on { background: #245668; border-color: #ffd479; color: #fff; }
  button.danger { background: transparent; border-color: rgba(255,120,110,.45); color: #ff9d8f; } button.danger:hover { background: rgba(255,100,90,.12); }
  button.small { padding: 2px 7px; font-size: 12px; } button:disabled { opacity: .4; cursor: default; }
  select, input, textarea { background: #101923; border: 1px solid #536b80; border-radius: 6px; color: #edf5ff; font: inherit; padding: 4px 6px; min-width: 0; }
  input[type=number] { width: 70px; } input[type=checkbox] { width: auto; }
  textarea { width: 100%; resize: vertical; min-height: 54px; line-height: 1.5; }
  label.f { display: grid; gap: 3px; font-size: 12px; color: #b9cad9; margin: 6px 0; }
  label.f > input, label.f > select { width: 100%; }
  .note { font-size: 12px; color: #8c98a6; line-height: 1.5; margin: 6px 0; } .warn { color: #ffd479; }
  .sub { margin: 12px 0 6px; font-size: 13px; color: #cfe0ee; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .sub .grow, .row .grow { flex: 1; }
  .list { display: grid; gap: 4px; }
  .item { display: flex; gap: 6px; align-items: center; padding: 4px 8px; border: 1px solid #2f3e4d; border-radius: 8px; background: #15202b; cursor: pointer; text-align: left; font-size: 13px; width: 100%; }
  .item:hover { border-color: #57718b; } .item.on { border-color: #ffd479; background: #24301f; }
  .item small { color: #8c98a6; font-size: 11px; margin-left: auto; }
  .item i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .stage-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
  .stage-head .grow { flex: 1; }
  .stage { flex: 1; min-height: 0; overflow: auto; border: 1px solid #2f3e4d; border-radius: 8px; background: #0b1016; }
  #map { display: block; image-rendering: pixelated; cursor: default; }
  #map.picking { cursor: crosshair; }
  #pickBar { margin-top: 6px; padding: 6px 10px; border: 1px solid #ffd479; border-radius: 8px; background: #2a2716; color: #ffe7a6; font-size: 13px; }
  .tabs { display: flex; gap: 4px; } .tabs button { flex: 1; white-space: nowrap; padding: 5px 4px; font-size: 13px; }
  .beat { border: 1px solid #2f3e4d; border-radius: 9px; background: #15202b; margin-bottom: 5px; }
  .beat.on { border-color: #ffd479; background: #1d2630; }
  .beat-head { display: flex; gap: 6px; align-items: baseline; padding: 6px 8px; cursor: pointer; font-size: 13px; }
  .beat-head b { color: #e8cf9e; flex: none; min-width: 34px; } .beat-head .n { color: #7f93a6; flex: none; width: 22px; text-align: right; }
  .beat-head span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #d9e3ee; }
  .beat-head .tags { margin-left: auto; color: #8fd3ff; font-size: 11px; flex: none; }
  .beat-body { padding: 2px 8px 8px; border-top: 1px solid #2a3846; }
  .beat-body label.f { margin: 3px 0; }
  .acts { display: grid; gap: 4px; margin: 4px 0; }
  .act { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 12px; }
  .act { padding: 3px 0; border-bottom: 1px dashed #26333f; } .act > b { width: 58px; flex: none; color: #b9cad9; font-weight: 600; }
  .pos { font-size: 12px; color: #8fd3ff; min-width: 64px; }
  .checks .item { cursor: pointer; } .checks .item.ok { color: #8be0c2; cursor: default; }
  .status { min-height: 18px; margin-top: 4px; font-size: 12px; color: #8be0c2; } .status.error { color: #ff9b9b; }
  [hidden] { display: none !important; }
  @media (max-width: 1400px) { .layout { grid-template-columns: 210px minmax(0, 1fr) 520px; } }
  @media (max-width: 1150px) { .layout { grid-template-columns: 1fr; height: auto; } .stage { flex: none; height: 60vh; } .panes { max-height: 70vh; } }
</style>
</head>
<body>
  <div class="top">
    <h1 title="左邊按鈕把人和鏡頭放到地圖上，中間的地圖拖曳就能移動位置，右邊寫每一頁的對話和演出。">🎬 劇情編輯器</h1>
    <div id="status" class="status grow" role="status"></div>
    <div class="row"><button type="button" class="primary" id="previewGame">▶ 從頭預覽</button><button type="button" id="exportFile">下載 story-scenes.js</button><button type="button" class="danger" id="resetFile">從檔案重新載入</button></div>
  </div>
  <div class="layout">
    <!-- 左邊：把人、鏡頭、燈放到地圖上；最下面是檢查 -->
    <section class="panel tools" aria-label="放到地圖上">
      <div id="addTools" style="display:grid;gap:8px"></div>
      <details class="fold" id="checkFold" open><summary id="checkTitle">檢查</summary><div id="checkList" class="list checks"></div></details>
      <p class="note">按上面的按鈕，再到中間的地圖上點一下，就會放在那裡。</p>
    </section>

    <!-- 中間：預覽窗 -->
    <section class="panel stagebox" aria-label="預覽窗">
      <div class="stage-head" style="margin-bottom:0"><b id="mapTitle"></b><span class="grow"></span>
        <label class="row" style="font-size:12px"><input type="checkbox" id="showSolid" checked>不可穿透格</label>
        <label class="row" style="font-size:12px"><input type="checkbox" id="showCams" checked>鏡頭範圍</label>
        <button type="button" class="small" id="zoomOut" aria-label="縮小">－</button><span id="zoomText" style="font-size:12px;min-width:40px;text-align:center"></span><button type="button" class="small" id="zoomIn" aria-label="放大">＋</button>
      </div>
      <div class="stage" id="stage"><canvas id="map"></canvas></div>
      <div id="pickBar" hidden></div>
      <p class="note" style="margin:0">點選、拖曳移動；Alt＋滾輪縮放。紫色箭頭＝這頁的走位、黃框＝這頁的鏡頭，都可以拖。</p>
    </section>

    <!-- 右邊：劇情、場上的人與鏡頭、對話與演出 -->
    <section class="panel side edit" aria-label="劇情內容">
      <div class="box">
        <div class="scenebar">
          <label for="sceneSel">劇情</label><select id="sceneSel"></select>
          <label for="sceneIdInput">ID</label><input id="sceneIdInput" spellcheck="false" title="劇情 ID：遊戲網址用這個名字找劇情；只能用英文、數字、底線、減號">
          <button type="button" class="small" id="sceneNew" title="新增一段劇情">＋新</button><button type="button" class="small" id="sceneMore" aria-expanded="false" title="標題、副標題、複製、刪除">⚙</button>
        </div>
        <div class="settings" id="sceneSettings" hidden>
          <span>標題</span><input id="sceneTitle">
          <span>副標題</span><input id="sceneSub" placeholder="例如：六年前 · 臨時救護區">
          <span></span><div class="row"><button type="button" class="small" id="sceneCopy">複製這段劇情</button><button type="button" class="small danger" id="sceneDel">刪除這段劇情</button></div>
        </div>
      </div>
      <div class="box">
        <div class="box-head"><span>場上的人與鏡頭</span><span class="grow"></span>
          <button type="button" class="small" id="objFold" aria-expanded="true" aria-label="收起場上的人與鏡頭">▴</button></div>
        <div class="objs" id="objList"></div>
      </div>
      <div class="box work">
        <div class="tabs"><button type="button" id="tabBeats" class="on">📜 對話與演出</button><button type="button" id="tabObj" title="選取的物件">🔧 物件</button><button type="button" id="tabFaces">🖼️ 頭像</button><button type="button" id="tabScene" title="劇情設定">⚙️ 設定</button></div>
        <div class="panes">
          <div id="paneBeats"></div>
          <div id="paneObj" hidden></div>
          <div id="paneFaces" hidden></div>
          <div id="paneScene" hidden></div>
        </div>
      </div>
    </section>
  </div>

  <script src="data/asset-moves.js?v=init-20261106"></script><script src="js/asset-moves.js?v=init-20261106"></script>   <!-- 素材搬家：瀏覽器暫存裡的舊路徑換成新路徑（必須最先載入） -->
  <script src="js/draft-sync.js?v=orderfix-20261111"></script>
  <script src="data/tiles.js?v=dynamo-20261113"></script>
  <script src="data/chairs.js?v=red02-20261026"></script>
  <script src="data/story-maps.js?v=cat-20261112"></script>
  <script src="data/characters.js?v=guideability-20261025"></script>
  <script src="data/monsters.js?v=gourd-speed-20261028"></script>
  <script src="data/story-scenes.js?v=cat14-20261112"></script>
  <script src="js/ui-feedback.js"></script>
  <script src="js/project-save.js?v=savecheck-20261111"></script>
  <script src="js/stamp-transform.js?v=stampscale-20261105"></script>   <!-- 物件的大小、角度（跟遊戲共用同一套算法） -->
  <script src="data/elevators.js?v=passage-20261002"></script>   <!-- 電梯的擋路格（走位路線要繞開） -->
  <script src="js/story-route.js?v=route2-20261108"></script>   <!-- 劇情找路：走位虛線＝遊戲真的會走的路 -->
  <script src="data/costumes.js?v=dismantle-20261109"></script><script src="data/costume-placement.js?v=bday-20261108"></script>   <!-- 角色身上的配件選單 -->
  <script src="js/story-editor.js?v=delay2-20261112"></script>
  <script>const storySaver = ProjectSave.attach({
    after: ['exportFile'],
    files: [{ path: 'data/story-scenes.js', label: '劇情', text: () => storyExportText() }],
    status: (m, e) => status(m, e),
  });</script>
  <script src="js/editor-nav.js?v=navfold-20261026"></script>
</body>
</html>
