<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>角色資料頁｜Y102 應變中心</title>
  <link rel="stylesheet" href="css/ui-feedback.css">
  <style>
    :root { color-scheme:dark; font-family:system-ui,"Microsoft JhengHei",sans-serif; color:#e8f1fa; background:#0d131b }
    * { box-sizing:border-box }
    body { margin:0; padding:28px; max-width:1440px; margin-inline:auto; background:radial-gradient(circle at 85% 0%,#1e3545 0,transparent 37%) }
    h1,h2,h3,p { margin-top:0 } h1 { font-size:27px; margin-bottom:5px } h2 { font-size:17px; margin-bottom:15px } h3 { font-size:14px; color:#9bc8e5; margin-bottom:12px }
    p,.muted,small { color:#9eb0c0; line-height:1.5 }
    a { color:#9bd9ff; text-decoration:none } a:hover { text-decoration:underline }
    button,input,textarea { font:inherit } button { cursor:pointer; color:#eaf5ff; background:#263d50; border:1px solid #52718a; border-radius:9px; padding:9px 13px }
    button.primary { background:#2b6581; border-color:#6abce3; font-weight:700 } button.danger { color:#ffd0c9; border-color:#925d5b; background:#4b3035 }
    .top { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:20px }
    .top p { margin-bottom:0 } .nav { display:flex; gap:15px; white-space:nowrap; padding-top:7px }
    .notice { border:1px solid #426781; border-left:4px solid #71c8fa; border-radius:10px; background:#152332; padding:12px 15px; margin-bottom:18px; font-size:13px; line-height:1.6 }
    .notice strong { color:#d9efff } code { color:#b6ddf5; background:#0e1b29; border-radius:4px; padding:1px 4px }
    .layout { display:grid; grid-template-columns:minmax(240px,290px) minmax(0,1fr); gap:18px; align-items:start }
    .panel { background:#18232e; border:1px solid #344d61; border-radius:15px; box-shadow:0 12px 38px #0005 }
    .sidebar { padding:16px; position:sticky; top:14px; max-height:calc(100vh - 28px); display:flex; flex-direction:column }
    .sidebar-head { display:flex; align-items:center; justify-content:space-between }
    .count { color:#84cfec; font-size:12px; background:#213c4f; border-radius:20px; padding:3px 8px }
    #search { width:100%; background:#0e1822; color:#e8f3fd; border:1px solid #405e74; border-radius:8px; padding:10px 11px; margin-bottom:12px }
    #characterList { overflow:auto; min-height:120px; display:grid; align-content:start; gap:6px; padding-right:4px }
    .character-item { display:flex; width:100%; text-align:left; align-items:center; gap:11px; padding:8px; background:#182633; border-color:transparent }
    .character-item.selected { background:#29455a; border-color:#82cdf1 }
    .character-item img { width:50px; height:50px; object-fit:cover; image-rendering:pixelated; background:#101a25; border-radius:8px }
    .character-item span { display:grid; gap:2px; min-width:0 } .character-item b { font-size:15px } .character-item small { font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
    .content { padding:22px; min-height:700px }
    .hero { display:flex; gap:18px; align-items:center; border-bottom:1px solid #344e62; padding-bottom:18px }
    .hero img { width:86px; height:86px; object-fit:cover; image-rendering:pixelated; border-radius:13px; background:#101b27; border:1px solid #41627a }
    .hero h2 { font-size:23px; margin-bottom:3px } .hero p { margin:0; font-size:13px }
    .tag { display:inline-block; border-radius:20px; background:#27495c; color:#a9e1fd; font-size:12px; padding:3px 9px; margin-bottom:6px }
    .summary { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin:18px 0 22px }
    .summary-card { background:#101c27; border:1px solid #324c61; border-radius:10px; padding:10px 12px }
    .summary-card small { display:block; margin-bottom:3px; font-size:11px } .summary-card strong { font-size:19px; color:#dceefa }
    .field-section { margin:0 0 20px; border-top:1px solid #314b5f; padding-top:18px }
    .field-section h3 { margin-bottom:5px } .field-section>p { font-size:12px; margin-bottom:11px }
    .fields { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px }
    .field { display:flex; flex-direction:column; gap:5px; min-width:0; color:#b9cbd9; font-size:12px }
    .field.wide { grid-column:1/-1 }
    .field input,.field textarea { width:100%; color:#edf7ff; background:#0e1822; border:1px solid #47647a; border-radius:8px; padding:8px 9px; outline:none }
    .field input:focus,.field textarea:focus,#search:focus { border-color:#89d3f5; box-shadow:0 0 0 2px #5baad03b }
    .field textarea { min-height:72px; resize:vertical; line-height:1.5 }
    .field input[type="checkbox"] { width:18px; height:18px; margin:7px 0 }
    .field input[type="color"] { height:37px; padding:3px }
    .field em { font-style:normal; color:#789bb1; font-size:11px }
    .subgroup { margin:14px 0 0; padding:14px; background:#111d28; border:1px solid #2b4559; border-radius:10px }
    .subgroup h4 { margin:0 0 10px; font-size:13px; color:#a8d8ef }
    .foot { border-top:1px solid #344e62; padding-top:18px; margin-top:24px }
    .actions { display:flex; gap:9px; flex-wrap:wrap; margin-bottom:9px }
    #status { min-height:22px; color:#8ce0be; font-size:13px; margin-top:8px }
    #exportOut { width:100%; min-height:100px; margin-top:12px; background:#0b151f; color:#a9cbdb; border:1px solid #345065; border-radius:8px; padding:10px; font:11px/1.45 Consolas,monospace; display:none }
    #exportOut.visible { display:block }
    @media(max-width:900px) { .fields { grid-template-columns:repeat(2,minmax(0,1fr)) } .summary { grid-template-columns:repeat(2,minmax(0,1fr)) } }
    @media(max-width:650px) { body { padding:14px } .layout { grid-template-columns:1fr } .sidebar { position:static; max-height:none } #characterList { grid-template-columns:repeat(2,minmax(0,1fr)); max-height:260px } .content { padding:16px } .fields { grid-template-columns:1fr } }
  </style>
</head>
<body>
  <header class="top">
    <div><h1>🪪 角色資料頁</h1><p>查看並調整溫特與目前可出勤戰鬥人員的數值。</p></div>
    <nav class="nav"><a class="back" href="塔防原型.html">← 回遊戲</a><a class="back" href="怪物編輯器.html">怪物編輯器</a></nav>
  </header>
  <div class="notice"><strong>編輯方式：</strong>修改會先自動保存在這台瀏覽器；遊戲不會讀取尚未匯出的草稿。確認後按「下載 characters.js」，用下載的檔案取代 <code>data/characters.js</code>，重新開啟遊戲才會正式生效。角色 ID 與對話內容會保留。</div>
  <main class="layout">
    <aside class="panel sidebar">
      <div class="sidebar-head"><h2>戰鬥人員</h2><span id="count" class="count"></span></div>
      <input id="search" type="search" placeholder="搜尋名字、職務或能力" aria-label="搜尋角色">
      <div id="characterList" aria-label="角色清單"></div>
    </aside>
    <section class="panel content">
      <div class="hero"><img id="portrait" alt="角色頭像"><div><span id="kindTag" class="tag"></span><h2 id="editingTitle"></h2><p id="heroSub"></p></div></div>
      <div id="summary" class="summary"></div>
      <div id="fields"></div>
      <div class="foot">
        <div class="actions"><button id="download" class="primary">⬇ 下載 characters.js</button><button id="showExport">查看匯出內容</button><button id="reset" class="danger">從目前檔案重新載入</button></div>
        <small>下載檔案後請放進遊戲資料夾的 <code>data/</code>，並重新整理遊戲。想同步到另一台電腦，還需要將檔案提交至 Git。</small>
        <div id="status" role="status" aria-live="polite"></div>
        <textarea id="exportOut" readonly aria-label="角色資料匯出內容"></textarea>
      </div>
    </section>
  </main>
  <script src="data/characters.js"></script>
  <script src="js/sfx.js"></script><script src="js/ui-feedback.js"></script>
  <script src="js/character-editor.js"></script>
</body>
</html>
