<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>障礙物物件編輯器</title><link rel="stylesheet" href="css/object-editor.css"><link rel="stylesheet" href="css/ui-feedback.css"></head>
<body><h1>🧱 障礙物物件編輯器　<a class="back" href="塔防原型.html">← 回遊戲</a></h1>
<main class="layout"><aside class="panel"><h2>障礙物</h2><div id="list" class="list"></div><div class="row"><button id="addObj" class="btn primary">＋ 新增物件</button><button id="delObj" class="btn">🗑 刪除</button></div><button id="reset" class="btn">從 objects.js 重設</button></aside>
<section class="panel"><div class="row"><label>名稱</label><input id="name"></div><div class="row"><label>價格</label><input id="cost" type="number"><label>HP</label><input id="hp" type="number"></div><div class="row orient"><label>方向</label><button data-o="h" class="btn">橫版 H</button><button data-o="v" class="btn">直版 V</button></div><div class="row"><label>圖片路徑</label><input id="file" style="flex:1"><button id="pickImg" class="btn">選圖片</button><input type="file" id="imgFile" accept="image/*" hidden></div><div class="row"><label>圖片格數</label><input id="w" type="number" min="1" max="10"> × <input id="h" type="number" min="1" max="10"></div><p class="help">點圖片上的格子切換紅色「擋路」區。圖片可以很高，但只要最下面的格子擋路，就只選最下面。</p><div class="stage"><div id="grid" class="grid"></div></div><div id="status" class="status"></div></section>
<aside class="panel right"><h2>匯出設定</h2><p class="help">編輯會自動保存在這個瀏覽器。完成後下載並用新檔案取代 <b>data/objects.js</b>，遊戲就會使用新的碰撞範圍。</p><button id="generate" class="btn primary">產生匯出文字</button> <button id="download" class="btn">下載 objects.js</button><textarea id="out" class="export" readonly></textarea></aside></main>
<script src="js/sfx.js"></script><script src="js/ui-feedback.js"></script><script src="data/objects.js"></script><script src="js/object-editor.js"></script></body></html>
