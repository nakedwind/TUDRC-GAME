<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>障礙物物件編輯器</title><link rel="stylesheet" href="css/object-editor.css"><link rel="stylesheet" href="css/ui-feedback.css"></head>
<body><h1>🧱 障礙物物件編輯器　<a class="back" href="塔防原型.html">← 回遊戲</a></h1>
<main class="layout"><aside class="panel"><h2>可放置物件</h2><div id="list" class="list"></div><div class="row"><button id="addObj" class="btn primary">＋ 新增物件</button><button id="delObj" class="btn">🗑 刪除</button></div><button id="reset" class="btn">從正式資料重設</button></aside>
<section class="panel"><div class="row"><label>名稱</label><input id="name"></div><div class="row"><label>價格</label><input id="cost" type="number"><label>HP</label><input id="hp" type="number"></div><div class="row orient"><label>方向</label><button data-o="h" class="btn">橫版 H</button><button data-o="v" class="btn">直版 V</button></div><div class="row"><label>圖片路徑</label><input id="file" style="flex:1"><button id="pickImg" class="btn">選圖片</button><input type="file" id="imgFile" accept="image/*" hidden></div><div class="row"><label>圖片格數</label><input id="w" type="number" min="1" max="10"> × <input id="h" type="number" min="1" max="10"></div><p class="help">置物箱修改會在重新進入遊戲時套用。點圖片上的格子切換紅色「擋路」區。圖片可以很高，但只要最下面的格子擋路，就只選最下面。</p><div class="stage"><div id="grid" class="grid"></div></div><div id="status" class="status"></div></section>
<aside class="panel right"><h2>匯出設定</h2><p class="help">編輯會自動保存在這個瀏覽器。選擇要匯出的類別，下載後取代對應的 <b>data/objects.js</b> 或 <b>data/decorations.js</b> 或 <b>data/ores.js</b>、<b>data/storage-boxes.js</b>，遊戲就會使用新的設定。</p><select id="exportKind"><option value="obstacles">障礙物：objects.js</option><option value="decorations">裝飾物：decorations.js</option><option value="ores">異質礦：ores.js</option><option value="storageBoxes">置物箱：storage-boxes.js</option></select><button id="generate" class="btn primary">產生匯出文字</button> <button id="download" class="btn">下載所選資料</button><textarea id="out" class="export" readonly></textarea></aside></main>
<script src="js/draft-sync.js?v=sync-20261021"></script>   <!-- 編輯器暫存和專案檔自動合併（多人協作不掉資料） -->
  <script src="js/sfx.js?v=milkfish-20261020"></script><script src="js/ui-feedback.js"></script><script src="data/storage-boxes.js?v=storage-collision-20261013"></script><script src="data/ores.js?v=ore-editor-20261012"></script><script src="data/objects.js?v=iron-gate-20261013"></script><script src="data/decorations.js?v=stove-20261022"></script><script src="js/object-editor.js?v=sync-20261021"></script>
  <script src="js/project-save.js?v=sync-20261021"></script>   <!-- 一鍵存到專案 -->
  <script>ProjectSave.attach({ after: ['download'], files: [{ path: 'data/objects.js', label: '障礙物', text: () => source('obstacles') }, { path: 'data/decorations.js', label: '裝飾', text: () => source('decorations') }, { path: 'data/storage-boxes.js', label: '置物箱', text: () => source('storageBoxes') }, { path: 'data/ores.js', label: '異質礦', text: () => source('ores') }], status: (m, e) => { const s = document.getElementById('status'); if (s) { s.textContent = m; s.style.color = e ? '#ff8f8f' : ''; } } });</script>  <script src="js/editor-nav.js?v=nav2-20261022"></script>   <!-- 最上方的編輯器入口（所有編輯器共用） -->
</body></html>
