<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>開發工坊編輯器｜Y102 應變中心</title>
<link rel="stylesheet" href="css/style.css?v=noclip-20261023">   <!-- 遊戲本身的樣式：預覽跟遊戲裡看到的一模一樣 -->
<link rel="stylesheet" href="css/ui-feedback.css">
<style>
  /* ---- 編輯器自己的樣子（蓋掉遊戲樣式裡 body 的設定） ---- */
  :root { color-scheme: dark; }
  body { display: block; max-width: none; min-height: 0; margin: 0; padding: 18px 22px; background: #10151c; color: #e8edf5;
    font-family: system-ui, 'Microsoft JhengHei', sans-serif; -webkit-user-select: text; user-select: text; }
  h1 { font-size: 23px; margin: 0 0 4px; } h2 { font-size: 15px; margin: 0 0 10px; color: #ffe3a1; }
  p.lead { color: #aabacc; margin: 0; font-size: 13px; line-height: 1.5; } a { color: #9bd2ff; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; margin-bottom: 14px; }
  .nav { display: flex; gap: 14px; padding-top: 6px; white-space: nowrap; font-size: 13px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  #status { font-size: 13px; color: #9fd8c4; }
  #status.err { color: #ff9c9c; }
  .layout { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 14px; align-items: start; }
  .panel { background: #1b2530; border: 1px solid #3a4d60; border-radius: 12px; padding: 14px; min-width: 0; }
  .panel + .panel { margin-top: 12px; }
  .ed-btn { cursor: pointer; font: inherit; font-size: 13px; color: #eaf4ff; background: #2a3c50; border: 1px solid #57718b; border-radius: 8px; padding: 7px 11px; }
  .ed-btn:hover { background: #345169; } .ed-btn.primary { background: #236b79; border-color: #69b9c1; } .ed-btn.danger { border-color: #9a5050; }
  .field { display: grid; gap: 4px; margin-bottom: 10px; font-size: 12px; color: #b9cad9; }
  .field input[type=text], .field textarea, .field select { width: 100%; background: #101923; border: 1px solid #536b80; border-radius: 7px; color: #edf5ff; font: inherit; font-size: 13px; padding: 6px 8px; }
  .field textarea { min-height: 54px; resize: vertical; line-height: 1.45; }
  .field .hint, .form-sec-body > .hint, .info-part > .hint { color: #7f93a6; font-size: 11px; line-height: 1.5; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
  .num { display: grid; grid-template-columns: minmax(0,1fr) 64px; gap: 6px; align-items: center; }
  .num input[type=range] { width: 100%; accent-color: #6bdbbd; }
  .num input[type=number] { width: 64px; background: #101923; border: 1px solid #536b80; border-radius: 6px; color: #edf5ff; font: inherit; font-size: 12px; padding: 4px 5px; }
  .color { display: flex; gap: 6px; align-items: center; }
  .color input[type=color] { width: 38px; height: 28px; padding: 0; border: 1px solid #536b80; border-radius: 6px; background: #101923; }
  .color input[type=text] { flex: 1; }
  .style-group { border-top: 1px solid #2c3c4c; padding-top: 10px; margin-top: 4px; }
  .right-col { min-width: 0; }
  #styleForm { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 0 18px; }   /* 外觀：在預覽下面排成好幾欄 */
  .style-group > b { display: block; color: #ffe3a1; font-size: 12px; margin-bottom: 6px; }
  #itemList { display: grid; gap: 5px; max-height: 300px; overflow: auto; margin-bottom: 12px; scrollbar-width: thin; }
  #itemList button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; cursor: pointer; font: inherit; font-size: 13px;
    color: #e8edf5; background: #15202b; border: 1px solid #334a5d; border-radius: 8px; padding: 5px 8px; }
  #itemList button.sel { background: #224358; border-color: #82cbe2; }
  #itemList button.changed::after { content: '已修改'; margin-left: auto; color: #e7b98d; font-size: 11px; }
  #itemList button.added::after { content: '新增'; margin-left: auto; color: #8fe0b0; font-size: 11px; }
  #itemList button.removed { opacity: .5; } #itemList button.removed span { text-decoration: line-through; }
  #itemList button.removed::after { content: '已刪除'; margin-left: auto; color: #ff9c9c; font-size: 11px; }
  #itemList .list-head { color: #ffe3a1; font-size: 12px; margin: 4px 0 0; }
  .removed-note { color: #ffb3b3; font-size: 13px; line-height: 1.5; margin: 0 0 10px; }
  .preview-stage .ws-tile { cursor: grab; }   /* 點一下＝選它；按住拖曳＝調整順序 */
  .preview-stage .ws-tile.dragging { opacity: .45; }
  .preview-stage .ws-tile.drop-swap { outline: 2px dashed #8fd3ff; outline-offset: 2px; }   /* 放開會跟這格互換 */
  .val-table { width: 100%; table-layout: fixed; border-collapse: collapse; margin: -4px 0 12px; font-size: 12px; }   /* 欄寬固定：每一把武器的表格都對齊 */
  .val-table col.vt-name { width: 118px; }
  .val-table th { color: #b9cad9; font-weight: 600; text-align: left; padding: 3px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .val-table thead th { color: #ffe3a1; text-align: center; }
  .val-table th small { color: #7f93a6; font-weight: 400; }
  .val-table td { padding: 2px 3px; }
  .val-table input { width: 100%; min-width: 0; background: #101923; border: 1px solid #536b80; border-radius: 6px; color: #edf5ff; font: inherit; font-size: 12px; padding: 4px 5px; text-align: right; }
  .val-table input:disabled { opacity: .35; }
  .preview-stage .ws-tile.ed-sel { outline: 2px solid #82cbe2; outline-offset: 1px; }
  /* 右側紙娃娃：點格子打開的「穿上／卸下」選單 */
  .pv-slot-menu { display: flex; flex-direction: column; gap: 4px; padding: 8px; border: 1px solid rgba(255,212,121,.35); border-radius: 10px; background: rgba(7,12,18,.92); }
  .pv-slot-menu b { color: #ffe3a1; font-size: 12px; }
  .pv-slot-menu button { padding: 5px 8px; border: 1px solid rgba(255,255,255,.12); border-radius: 7px; background: rgba(37,43,51,.8); color: #e8eef3; cursor: pointer; font: inherit; font-size: 12px; text-align: left; }
  .pv-slot-menu button.on { border-color: #ffd479; }
  .pv-slot-menu button.off { color: #ffb3b3; }
  .pv-slot-menu p { margin: 0; color: #8c96a1; font-size: 11px; }
  .preview-stage .doll-slot { cursor: pointer; }   /* 左邊選到的那一格 */
  /* 預覽的裝備狀態：一排可以點的按鈕（跟素材列的分頁一樣） */
  .pv-bar { flex-wrap: nowrap; }   /* 「預覽」「裝備狀態」跟按鈕排在同一行；按鈕太多時只在右邊那一塊裡換行 */
  .pv-bar { align-items: flex-start; }   /* 按鈕換成兩行時，標題對齊第一行 */
  .pv-bar > h2, .pv-label { flex: none; padding-top: 4px; }
  .pv-label { margin-left: 15px; color: #ffe3a1; font-size: 15px; font-weight: 700; white-space: nowrap; }
  .pv-modes { display: flex; flex-wrap: wrap; gap: 6px; flex: 1 1 0; min-width: 0; }
  #autoArrange { flex: none; padding: 5px 10px; font-size: 12px; }
  .pv-mode { border: 1px solid #3a4656; border-radius: 999px; background: #232a35; color: #b9c3cf; padding: 6px 12px; cursor: pointer; font: inherit; font-size: 12px; white-space: nowrap; }
  .pv-mode:hover { border-color: #8fd3ff; color: #fff; }
  .pv-mode.sel { border-color: #8fd3ff; background: #2b526b; color: #fff; }
  .img-off { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }   /* 圖片位移：左右、上下＋微調按鈕 */
  .img-off label { display: flex; align-items: center; gap: 4px; font-size: 12px; }
  .img-off input { width: 58px; background: #101923; border: 1px solid #536b80; border-radius: 6px; color: #edf5ff; font: inherit; font-size: 12px; padding: 4px 5px; text-align: right; }
  .img-off .nudge { display: flex; gap: 4px; }
  .img-off .nudge .ed-btn { padding: 3px 8px; font-size: 12px; }
  .cost-row { display: grid; gap: 6px; margin: -4px 0 12px; }   /* 開發／升級的費用：一排 */
  .cost-row .field { margin: 0; font-size: 11px; white-space: nowrap; }
  .cost-row input { width: 100%; min-width: 0; background: #101923; border: 1px solid #536b80; border-radius: 6px; color: #edf5ff; font: inherit; font-size: 12px; padding: 4px 5px; text-align: right; }
  .cost-row input.is-edited { border-color: #c79a5a; }   /* 改過的 */
  /* 左邊每一段都可以收起來／打開（js/workshop-editor.js 的 sec） */
  .form-sec { margin: 0 0 8px; border: 1px solid #34495c; border-radius: 9px; background: #182532; }
  .form-sec > summary { cursor: pointer; padding: 8px 10px; font-size: 13px; font-weight: 700; color: #e3edf6; list-style: none; user-select: none; }
  .form-sec > summary::-webkit-details-marker { display: none; }
  .form-sec > summary::before { content: '▸'; display: inline-block; width: 14px; color: #8fb4d3; transition: transform .15s; }
  .form-sec[open] > summary::before { transform: rotate(90deg); }
  .form-sec > summary:hover { background: #20303f; border-radius: 9px; }
  .form-sec-body, .form-sec > #itemList { padding: 4px 10px 8px; }
  .sec-tools { display: flex; gap: 6px; margin: 0 0 8px; }
  .sec-tools .ed-btn { padding: 3px 9px; font-size: 12px; }
  .info-part { margin: 0 0 8px; padding: 0 8px; border: 1px solid #2f4152; border-radius: 8px; background: #15202b; }   /* 下方說明欄的版面：一塊一格（名稱、標籤、說明、效果框、按鈕），也可以收起來 */
  .info-part[open] { padding-bottom: 6px; }
  .info-part-head { display: flex; align-items: center; gap: 8px; padding: 7px 0; font-size: 12px; cursor: pointer; list-style: none; }
  .info-part-head::-webkit-details-marker { display: none; }
  .info-part-head::before { content: '▸'; color: #8fb4d3; transition: transform .15s; }
  .info-part[open] > .info-part-head::before { transform: rotate(90deg); }
  .info-part-head em { margin-left: auto; font-style: normal; font-size: 11px; color: #8be0c2; }
  .info-part-tools { display: flex; justify-content: flex-end; margin: -2px 0 6px; }
  .info-part-tools .ed-btn { padding: 2px 8px; font-size: 11px; }
  .info-part .cost-row { margin: 0 0 2px; }
  .info-part > label.field { gap: 2px; margin: 6px 0 2px; font-size: 11px; }   /* 每一塊的內文 */
  .info-part.flash { animation: infoPartFlash 1.4s; }   /* 從預覽點過來：框一下 */
  @keyframes infoPartFlash { 0%, 60% { border-color: #ffd479; box-shadow: 0 0 0 2px rgba(255,212,121,.45); } }
  #previewStage .ws-info [data-wsp] { cursor: pointer; }
  .cost-row input:disabled { opacity: .35; }
  .val-table input.is-text { border-color: #c79a5a; color: #ffd9a3; text-align: left; }   /* 填了文字（只顯示在效果說明） */
  /* ---- 素材圖（預覽下面）：跟地圖編輯器下方的素材列一樣 ---- */
  .asset-tabs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; }
  .asset-tabs input[type=search] { width: 160px; background: #101923; border: 1px solid #3a4656; border-radius: 999px; color: #edf5ff; font: inherit; font-size: 12px; padding: 6px 12px; }
  .asset-tab { border: 1px solid #3a4656; border-radius: 999px; background: #232a35; color: #b9c3cf; padding: 6px 11px; cursor: pointer; font: inherit; font-size: 12px; }
  .asset-tab:hover { border-color: #8fd3ff; color: #fff; }
  .asset-tab.sel { border-color: #8fd3ff; background: #2b526b; color: #fff; }
  .asset-tab .count { color: #8fd3ff; margin-left: 4px; font-variant-numeric: tabular-nums; }
  .asset-grid { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; }
  .asset { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 96px; padding: 4px 4px 5px; background: #232a35; border: 2px solid #333c49; border-radius: 8px; cursor: pointer; font: inherit; color: #e8edf5; text-align: center; }
  .asset:hover { border-color: #5d7a96; }
  .asset.sel { border-color: #8fd3ff; background: #2b3a4a; }
  .asset.removed { opacity: .45; }
  .asset-thumb { display: grid; place-items: center; width: 100%; height: 64px; border-radius: 4px; overflow: hidden;
    background-color: #0e1116; background-size: 12px 12px; background-position: 0 0, 0 6px, 6px -6px, -6px 0;
    background-image: linear-gradient(45deg, #1b222c 25%, transparent 25%), linear-gradient(-45deg, #1b222c 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #1b222c 75%), linear-gradient(-45deg, transparent 75%, #1b222c 75%); }
  .asset-thumb img { max-width: 100%; max-height: 100%; object-fit: contain; image-rendering: pixelated; }
  .asset-thumb i { font-style: normal; font-size: 28px; }
  .asset b { font-size: 12px; font-weight: 600; line-height: 1.3; word-break: break-all; }
  .asset small { color: #8c98a6; font-size: 11px; }
  .asset-empty { width: 100%; padding: 14px; color: #7f8b99; font-size: 12px; text-align: center; margin: 0; }
  .asset-ctxmenu { position: fixed; z-index: 9999; min-width: 150px; padding: 4px; background: #1d222b; border: 1px solid #3a4250; border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.5); }
  .asset-ctxmenu[hidden] { display: none; }
  .asset-ctxmenu button { display: block; width: 100%; padding: 7px 12px; background: none; border: 0; border-radius: 6px; color: #e6e9ef; font: inherit; font-size: 13px; text-align: left; cursor: pointer; }
  .asset-ctxmenu button:hover { background: #2c3443; }
  #itemList img, #itemList i { width: 30px; height: 30px; object-fit: contain; image-rendering: pixelated; font-style: normal; display: grid; place-items: center; }
  #itemList small { color: #8fa3b5; font-size: 11px; margin-left: 4px; }
  .img-row { display: grid; grid-template-columns: 56px minmax(0,1fr); gap: 8px; align-items: center; }
  .img-row .thumb { width: 56px; height: 56px; display: grid; place-items: center; border-radius: 9px; background: #0e1721; border: 1px solid #334a5d; }
  .img-row .thumb img { max-width: 48px; max-height: 48px; image-rendering: pixelated; }
  .img-btns { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  /* ---- 預覽區：裡面放的就是遊戲的開發工坊（同一套樣式） ---- */
  .preview-wrap { overflow: auto; border: 1px solid #42586e; border-radius: 10px; background: repeating-conic-gradient(#182431 0 25%, #131d28 0 50%) 0 0 / 24px 24px; }
  .preview-stage { position: relative; margin: 0 auto; }
  .preview-stage #workshop { inset: 0; }
</style>
</head>
<body>
  <div class="top">
    <div>
      <h1>🔧 開發工坊編輯器</h1>
      <p class="lead">修改諾亞開發工坊裡的裝備圖片、名稱、說明，以及文字顏色、大小和欄位大小。右邊的預覽就是遊戲裡的樣子。<br>
        改好按「💾 存到專案」（Ctrl+S）會寫進 <code>data/workshop.js</code>；遊戲按 Ctrl+F5 重新整理就會套用。名稱和圖片在背包、裝備欄也會跟著變。</p>
    </div>
    <div class="nav"><a href="塔防原型.html">← 回遊戲</a><a href="地圖編輯器.html">🗺️ 地圖編輯器</a><a href="基地編輯器.html">🏠 基地編輯器</a><a href="劇情地圖編輯器.html">📖 劇情地圖編輯器</a></div>
  </div>
  <div class="bar">
    <button type="button" class="ed-btn" id="downloadFile" title="不能直接存檔的瀏覽器用：下載後覆蓋 data/workshop.js">下載 workshop.js</button>
    <button type="button" class="ed-btn danger" id="resetFile" title="丟掉還沒存的修改，改回 data/workshop.js 檔案裡的內容">從檔案重設</button>
    <span id="status"></span>
  </div>

  <div class="layout">
    <div>
      <section class="panel">
        <div class="bar" style="justify-content:space-between;margin-bottom:8px"><h2 style="margin:0">裝備與武器</h2>
          <button type="button" class="ed-btn primary" id="addItem" title="新增一件裝備（右邊預覽的最後面會多一格）">＋ 新增裝備</button></div>
        <details class="form-sec" data-sec="list" open><summary>📋 清單（點一件來改）</summary><div id="itemList"></div></details>   <!-- 可以收起來，下面的設定比較快看到 -->
        <div id="itemForm"></div>
      </section>
    </div>
    <div class="right-col">
    <section class="panel">
      <div class="bar pv-bar">
        <h2 style="margin:0">預覽</h2>
        <span class="pv-label">裝備狀態</span>
        <div class="pv-modes" id="previewModes"></div>   <!-- 按鈕：js/workshop-editor.js 的 renderPreviewModes -->
        <button type="button" class="ed-btn" id="autoArrange" hidden title="丟掉拖曳調整的順序，回到原本的順序">恢復原本順序</button>
      </div>
      <div class="preview-wrap"><div class="preview-stage" id="previewStage"></div></div>
    </section>
      <section class="panel asset-panel">   <!-- 所有裝備、武器的素材圖（點一下＝選它；右鍵＝以檔案總管開啟） -->
        <div class="asset-tabs" id="assetTabs"></div>
        <div class="asset-grid" id="assetGrid"></div>
      </section>
      <section class="panel style-panel">
        <h2>外觀（所有裝備欄位一起改）</h2>
        <div id="styleForm"></div>
        <button type="button" class="ed-btn" id="styleReset">外觀恢復預設</button>
      </section>
    </div>
  </div>

  <script src="data/equipment.js?v=effnum-20261023"></script>   <!-- 裝備、武器的原始資料 -->
  <script src="data/supplies.js?v=effnum-20261023"></script>   <!-- 道具名稱（說明裡的道具上色用） -->
  <script src="data/items.js"></script>
  <script>document.write('<script src="data/workshop.js?t=' + Date.now() + '"><\/script>');</script>   <!-- 目前存在檔案裡的工坊設定；每次都讀最新的（背包編輯器改的說明也存在這裡） -->
  <script src="js/draft-sync.js?v=sync-20261021"></script>   <!-- 編輯器暫存和專案檔自動合併（多人協作不掉資料） -->
  <script src="js/workshop-config.js?v=btnsize-20261023"></script>  <!-- 預設外觀、套用設定的工具（跟遊戲共用） -->
  <script src="js/ui-feedback.js"></script>
  <script src="js/project-save.js?v=sync-20261021"></script>     <!-- 一鍵存到專案（所有編輯器共用） -->
  <script src="js/workshop-file.js?v=parts5-20261023"></script>   <!-- data/workshop.js 的存檔文字（跟背包編輯器共用） -->
  <script src="js/workshop-editor.js?v=btnsize-20261023"></script>
  <script src="js/editor-nav.js?v=achv-20261023"></script>   <!-- 最上方的編輯器入口（所有編輯器共用） -->
</body>
</html>
