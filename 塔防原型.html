<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台北地下災害應變中心 — 塔防原型</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #14171c; color: #e6e9ee;
    font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 12px; min-height: 100vh;
  }
  h1 { font-size: 18px; margin: 4px 0 8px; color: #8fd3ff; font-weight: 600; }
  #hud {
    display: flex; gap: 16px; flex-wrap: wrap; justify-content: center;
    background: #1d222b; padding: 8px 14px; border-radius: 8px; margin-bottom: 8px; font-size: 14px;
  }
  #hud b { color: #ffd479; }
  #hud .guide b { color: #7ee0c0; }
  #hud .hp b { color: #ff8f8f; }
  #wrap { position: relative; }
  canvas { background: #0e1116; border-radius: 8px; display: block; cursor: pointer; }
  #tools { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; justify-content: center; }
  .tbtn {
    background: #232a35; border: 2px solid #333c49; color: #e6e9ee;
    padding: 7px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; text-align: left; min-width: 120px;
  }
  .tbtn small { display: block; color: #9aa4b2; font-size: 11px; margin-top: 2px; }
  .tbtn.sel { border-color: #8fd3ff; background: #2b3a4a; }
  #hint { font-size: 12px; color: #9aa4b2; max-width: 560px; text-align: center; line-height: 1.7; margin-top: 4px; }
  #overlay {
    position: absolute; inset: 0; background: rgba(8,10,14,.86);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 8px; text-align: center; padding: 20px;
  }
  #overlay h2 { margin: 0 0 8px; font-size: 24px; }
  #overlay p { margin: 4px 0 16px; color: #c3ccd8; font-size: 14px; line-height: 1.7; }
  #overlay button { background: #2b6cb0; color: #fff; border: none; padding: 10px 24px; border-radius: 8px; font-size: 15px; cursor: pointer; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <h1>台北地下災害應變中心 · 塔防原型</h1>

  <div id="hud">
    <span>資源 <b id="money">0</b></span>
    <span class="hp">營地HP <b id="lives">0</b></span>
    <span class="guide">嚮導能量 <b id="guide">0</b></span>
    <span>波次 <b id="wave">0</b> / <b id="wavemax">0</b></span>
  </div>

  <div id="wrap">
    <canvas id="cv" width="550" height="600"></canvas>
    <div id="overlay">
      <h2 id="ov-title">塔防原型</h2>
      <p id="ov-text"></p>
      <button id="ov-btn">開始</button>
    </div>
  </div>

  <div id="tools">
    <button class="tbtn" data-type="theonie">🔥 希奧妮 (50)<small>遠程單體・傷害高・汙染快</small></button>
    <button class="tbtn" data-type="amber">⚡ 安柏 (40)<small>範圍・會誤失・汙染中</small></button>
    <button class="tbtn" data-type="red">🛡️ 雷德 (45)<small>近戰・汙染會自動降</small></button>
    <button class="tbtn" data-type="barrier">🧱 障礙物 (20)<small>擋路・可被怪物打破</small></button>
  </div>

  <div id="hint">
    怪物<b>由上往下</b>攻進最下方<b>營地</b>。點下方按鈕→再點空地放置。<br>
    用<b>障礙物</b>把怪物卡在哨兵火網裡（怪物會停下來打牆）。<br>
    點<b>已放置的哨兵</b>可花「嚮導能量」<b>疏導</b>。⚠️ 汙染值滿會<b>暴走</b>：停止攻擊＋營地扣血，要疏導才恢復。
  </div>

<script>
/* ===== 台北地下災害應變中心 — 塔防原型 v2 =====
   改版：怪物由上往下入侵營地；新增可破壞障礙物；哨兵營地內外皆可放。
*/
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const CELL = 50, COLS = 11, ROWS = 12;
const SPAWN_ROW = 0;          // 最上排：怪物出現處
const CAMP_ROW  = ROWS - 2;   // 營地：最下面兩排
const center = (c,r) => [c*CELL+CELL/2, r*CELL+CELL/2];

// ---- 哨兵（砲塔）類型 ----
const TYPES = {
  theonie: { name:'希奧妮', cost:50, range:2.6, dmg:22, rate:1.0, taint:7, splash:0,   color:'#ff7b39', accuracy:1.0, taintRegen:0 },
  amber:   { name:'安柏',   cost:40, range:2.0, dmg:11, rate:1.2, taint:5, splash:1.0, color:'#ffd24a', accuracy:0.7, taintRegen:0 },
  red:     { name:'雷德',   cost:45, range:1.4, dmg:16, rate:1.0, taint:3, splash:0,   color:'#ff5b6e', accuracy:1.0, taintRegen:6 },
};
const BARRIER = { cost:20, hp:150 };

let G;
function newGame(){
  G = {
    money: 150, lives: 12, guide: 100, guideMax: 100, guideRegen: 9,
    grid: {},                 // 'c,r' -> 佈署物件（哨兵或障礙物）
    towers: [], obstacles: [], enemies: [], effects: [],
    selType: null,
    waveIndex: 0, waves: buildWaves(),
    spawnQueue: [], spawnTimer: 0, curGap: 0.9, betweenWaves: 0,
    running: false, over: false, won: false,
  };
  updateHUD();
}

function buildWaves(){
  const w=[];
  for(let i=0;i<5;i++){
    w.push({ count: 6+i*3, hp: 40+i*28, speed: 42+i*5, reward: 8, gap: 0.9 - i*0.06 });
  }
  return w;
}
function startWave(){
  const w = G.waves[G.waveIndex];
  G.spawnQueue = [];
  for(let i=0;i<w.count;i++) G.spawnQueue.push({ hp:w.hp, speed:w.speed, reward:w.reward });
  G.spawnTimer = 0; G.curGap = w.gap;
}

// ---- 輸入 ----
document.querySelectorAll('.tbtn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const t = btn.dataset.type;
    G.selType = (G.selType===t) ? null : t;
    document.querySelectorAll('.tbtn').forEach(b=>b.classList.toggle('sel', b.dataset.type===G.selType));
  });
});

cv.addEventListener('click', e=>{
  if(!G.running) return;
  const rect = cv.getBoundingClientRect();
  const x = (e.clientX-rect.left) * (cv.width/rect.width);
  const y = (e.clientY-rect.top) * (cv.height/rect.height);
  const c = Math.floor(x/CELL), r = Math.floor(y/CELL);
  if(c<0||c>=COLS||r<0||r>=ROWS) return;
  const key = c+','+r;

  // 點到已放置的哨兵 → 疏導
  const occ = G.grid[key];
  if(occ){ if(occ.kind==='tower') soothe(occ); return; }

  // 放置
  if(!G.selType) return;
  if(r===SPAWN_ROW){ flash('這裡是怪物入口', ...center(c,r), '#ff8f8f'); return; }

  if(G.selType==='barrier'){
    if(G.money<BARRIER.cost){ flash('資源不足', ...center(c,r), '#ff8f8f'); return; }
    G.money-=BARRIER.cost;
    const o = { kind:'obstacle', c, r, hp:BARRIER.hp, maxhp:BARRIER.hp };
    G.grid[key]=o; G.obstacles.push(o);
  } else {
    const spec = TYPES[G.selType];
    if(G.money<spec.cost){ flash('資源不足', ...center(c,r), '#ff8f8f'); return; }
    G.money-=spec.cost;
    const [tx,ty]=center(c,r);
    const t = { kind:'tower', type:G.selType, c, r, x:tx, y:ty, cd:0, taint:0, berserk:false };
    G.grid[key]=t; G.towers.push(t);
  }
  updateHUD();
});

function soothe(t){
  const COST = 30, HEAL = 55;
  if(t.taint<=0 && !t.berserk){ flash('無需疏導', t.x, t.y-24, '#9aa4b2'); return; }
  if(G.guide < COST){ flash('嚮導能量不足', t.x, t.y-24, '#ff8f8f'); return; }
  G.guide -= COST;
  t.taint = Math.max(0, t.taint - HEAL);
  if(t.berserk && t.taint < 60) t.berserk = false;
  flash('疏導 -'+HEAL, t.x, t.y-24, '#7ee0c0');
  updateHUD();
}

// ---- 主迴圈（幀率校正：真實時間差 dt）----
let last = 0;
function loop(ts){
  const dt = Math.min(0.05, (ts-last)/1000 || 0);
  last = ts;
  if(G.running && !G.over) update(dt);
  draw();
  requestAnimationFrame(loop);
}

function update(dt){
  G.guide = Math.min(G.guideMax, G.guide + G.guideRegen*dt);

  // 生怪（在最上排隨機欄位）
  if(G.spawnQueue.length>0){
    G.spawnTimer -= dt;
    if(G.spawnTimer<=0){
      const s = G.spawnQueue.shift();
      const col = Math.floor(Math.random()*COLS);
      G.enemies.push({ col, x:center(col,0)[0], y:-CELL/2, hp:s.hp, maxhp:s.hp, speed:s.speed, reward:s.reward });
      G.spawnTimer = G.curGap;
    }
  }

  // 敵人往下移動（撞到障礙物就停下打牆）
  for(const e of G.enemies){
    const row = Math.floor(Math.max(0,e.y)/CELL);
    const belowKey = e.col+','+(row+1);
    const below = G.grid[belowKey];
    const blocked = below && below.kind==='obstacle';
    const stopY = (row+1)*CELL - CELL*0.30; // 卡在牆前
    let ny = e.y + e.speed*dt;
    if(blocked && ny>stopY){
      e.y = Math.min(e.y, stopY);
      below.hp -= 20*dt;                    // 打牆
      if(below.hp<=0){ delete G.grid[belowKey]; G.obstacles = G.obstacles.filter(o=>o!==below); }
    } else {
      e.y = ny;
    }
    if(e.y >= ROWS*CELL){ e.reached=true; }  // 攻進營地底線
  }
  for(const e of G.enemies){ if(e.reached){ G.lives--; e.dead=true; } }

  // 哨兵攻擊
  for(const t of G.towers){
    const spec = TYPES[t.type];
    if(spec.taintRegen && !t.berserk) t.taint = Math.max(0, t.taint - spec.taintRegen*dt);
    t.cd -= dt;
    if(t.berserk || t.cd>0) continue;
    const R = spec.range*CELL;
    let target=null, bestY=-1;
    for(const e of G.enemies){
      if(e.dead) continue;
      if(Math.hypot(e.x-t.x, e.y-t.y) <= R && e.y>bestY){ target=e; bestY=e.y; } // 優先打最靠近營地的
    }
    if(target){
      t.cd = 1/spec.rate;
      if(Math.random() < spec.accuracy){
        target.hp -= spec.dmg;
        if(spec.splash>0) for(const e of G.enemies){ if(e!==target && !e.dead && Math.hypot(e.x-target.x,e.y-target.y)<=spec.splash*CELL) e.hp-=spec.dmg*0.6; }
        G.effects.push({ x1:t.x,y1:t.y,x2:target.x,y2:target.y,life:0.12,color:spec.color });
      } else flash('MISS', t.x, t.y-24, '#9aa4b2');
      t.taint = Math.min(100, t.taint + spec.taint);
      if(t.taint>=100 && !t.berserk){ t.berserk=true; G.lives-=2; flash('暴走!', t.x, t.y-28, '#ff4d4d'); }
    }
  }

  for(const e of G.enemies){ if(e.hp<=0 && !e.dead){ e.dead=true; G.money+=e.reward; } }
  G.enemies = G.enemies.filter(e=>!e.dead);

  for(const f of G.effects) f.life-=dt;
  G.effects = G.effects.filter(f=>f.life>0);

  if(G.spawnQueue.length===0 && G.enemies.length===0){
    if(G.betweenWaves<=0){
      G.waveIndex++;
      if(G.waveIndex>=G.waves.length) win();
      else G.betweenWaves=2.5;
    } else { G.betweenWaves-=dt; if(G.betweenWaves<=0) startWave(); }
  }

  if(G.lives<=0){ G.lives=0; lose(); }
  updateHUD();
}

function flash(text,x,y,color){ G.effects.push({ text,x,y,life:0.8,color,vy:-20 }); }

// ---- 繪製 ----
function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  for(let c=0;c<COLS;c++) for(let r=0;r<ROWS;r++){
    let col = '#161b22';
    if(r===SPAWN_ROW) col = '#3a2330';        // 怪物入口（上）
    else if(r>=CAMP_ROW) col = '#182a24';     // 營地（下）
    ctx.fillStyle = col; ctx.fillRect(c*CELL+1, r*CELL+1, CELL-2, CELL-2);
  }
  // 區域標籤
  ctx.fillStyle='#8a5a6a'; ctx.font='11px sans-serif'; ctx.textAlign='left';
  ctx.fillText('▼ 怪物入口', 6, 14);
  ctx.fillStyle='#5aa88f'; ctx.textAlign='right';
  ctx.fillText('營地（守住這裡）', cv.width-6, ROWS*CELL-6);

  // 障礙物
  for(const o of G.obstacles){
    const [x,y]=center(o.c,o.r);
    ctx.fillStyle='#7a5a3a'; roundRect(x-22,y-22,44,44,6); ctx.fill();
    ctx.strokeStyle='#5a4128'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='#000'; ctx.fillRect(x-20,y+16,40,4);
    ctx.fillStyle='#c9a26a'; ctx.fillRect(x-20,y+16,40*Math.max(0,o.hp)/o.maxhp,4);
  }
  // 哨兵
  for(const t of G.towers){
    const spec = TYPES[t.type];
    ctx.fillStyle = t.berserk ? '#5a1f27' : spec.color;
    roundRect(t.x-21, t.y-21, 42, 42, 8); ctx.fill();
    ctx.fillStyle = '#0e1116'; ctx.font='bold 11px sans-serif'; ctx.textAlign='center';
    ctx.fillText(spec.name, t.x, t.y+3);
    const w=42, tx=t.x-21, ty=t.y+23;
    ctx.fillStyle='#000'; ctx.fillRect(tx,ty,w,5);
    ctx.fillStyle = t.taint>75?'#ff4d4d':(t.taint>45?'#ffb84d':'#7ee0c0');
    ctx.fillRect(tx,ty,w*t.taint/100,5);
    if(t.berserk){ ctx.fillStyle='#ff4d4d'; ctx.font='bold 10px sans-serif'; ctx.fillText('暴走', t.x, t.y-25); }
  }
  // 敵人
  for(const e of G.enemies){
    ctx.fillStyle='#c25bce'; ctx.beginPath(); ctx.arc(e.x,e.y,14,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(e.x-4.5,e.y-2,2.6,0,Math.PI*2); ctx.arc(e.x+4.5,e.y-2,2.6,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(e.x-4.5,e.y-2,1.2,0,Math.PI*2); ctx.arc(e.x+4.5,e.y-2,1.2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#000'; ctx.fillRect(e.x-15,e.y-22,30,4);
    ctx.fillStyle='#7CFC7C'; ctx.fillRect(e.x-15,e.y-22,30*Math.max(0,e.hp)/e.maxhp,4);
  }
  // 特效
  for(const f of G.effects){
    if(f.text){
      ctx.globalAlpha=Math.max(0,f.life/0.8); ctx.fillStyle=f.color; ctx.font='bold 13px sans-serif'; ctx.textAlign='center';
      ctx.fillText(f.text, f.x, f.y + (f.vy||0)*(0.8-f.life)); ctx.globalAlpha=1;
    } else {
      ctx.globalAlpha=Math.max(0,f.life/0.12); ctx.strokeStyle=f.color; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(f.x1,f.y1); ctx.lineTo(f.x2,f.y2); ctx.stroke(); ctx.globalAlpha=1;
    }
  }
}
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

// ---- HUD / 狀態 ----
function updateHUD(){
  document.getElementById('money').textContent = Math.floor(G.money);
  document.getElementById('lives').textContent = Math.max(0, G.lives);
  document.getElementById('guide').textContent = Math.floor(G.guide);
  document.getElementById('wave').textContent = Math.min(G.waveIndex+1, G.waves.length);
  document.getElementById('wavemax').textContent = G.waves.length;
}

const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ov-title');
const ovText  = document.getElementById('ov-text');
const ovBtn   = document.getElementById('ov-btn');
function showOverlay(title,text,btn){ ovTitle.textContent=title; ovText.innerHTML=text; ovBtn.textContent=btn; overlay.classList.remove('hidden'); }
function hideOverlay(){ overlay.classList.add('hidden'); }

function begin(){ newGame(); hideOverlay(); G.running=true; G.betweenWaves=0.01; }
function win(){ G.over=true; G.won=true; G.running=false; showOverlay('✅ Y 區已控制','你守住了營地、擋下所有波次！<br>之後就能包上劇情與美術。','再玩一次'); }
function lose(){ G.over=true; G.running=false; showOverlay('💀 營地失守','怪物攻進了營地。<br>試試多築牆把怪物卡住、並提早疏導快暴走的哨兵。','再挑戰'); }

ovBtn.addEventListener('click', begin);

newGame();
showOverlay('台北地下災害應變中心 · 塔防原型',
  '怪物會<b>從上往下</b>攻進最下方的<b>營地</b>。<br>用<b>障礙物</b>把牠們卡住、用<b>哨兵</b>火力清掉，<br>並在哨兵<b>暴走</b>前用嚮導能量<b>疏導</b>。<br>守住 5 波即可控制 Y 區。',
  '開始防禦');
requestAnimationFrame(loop);
</script>
</body>
</html>
