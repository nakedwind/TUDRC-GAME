<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台北地下災害應變中心 — 塔防原型</title>
<!-- 樣式（畫面外觀）放在獨立檔案 -->
<link rel="stylesheet" href="css/style.css?v=rclick-20261003">
<link rel="stylesheet" href="css/ui-feedback.css">
</head>
<body>
  <div id="wrap">
    <canvas id="cv" width="1280" height="720"></canvas>
    <div id="screenShade"></div>
    <div id="mapTransition" aria-hidden="true"></div>

    <div id="missionText">目前任務：守住營地 <span class="mission-secondary">| 破壞異質核心</span></div>
    <div id="pauseBadge" class="hidden" role="status">⏸ 已暫停<small>按 P 繼續</small></div>
    <div id="systemNotices" role="status" aria-live="polite" aria-atomic="false"></div>

    <div id="overlay">
      <div class="overlay-card">
        <div class="panel-kicker">緊急簡報</div>
        <h2 id="ov-title">塔防原型</h2>
        <p id="ov-text"></p>
        <div id="mapPickRow" class="hidden" style="margin-top:10px;font-size:15px;color:#cfd8e3">
          🗺️ 選擇地圖：<select id="mapPick" style="font-size:15px;padding:6px 10px;border-radius:6px;background:#232a35;color:#e6ebf2;border:1px solid #4f8fbf"></select>
        </div>
      </div>
      <button id="ov-btn">開始</button>
    </div>
    <!-- 哨兵選單（點哨兵時彈出，內容由 game.js 產生） -->
    <div id="sentryMenu" class="hidden"></div>
    <!-- 地面情境選單（點空地時彈出） -->
    <div id="groundMenu" class="hidden"></div>
    <!-- NPC 正式對話框（靠近角色按 Space／E） -->
    <div id="dialogueBox" class="hidden" role="dialog" aria-live="polite">
      <button id="dialogueClose" type="button" aria-label="關閉對話">×</button>
      <img id="dialoguePortrait" alt="角色頭像">
      <div class="dialogue-content">
        <div class="dialogue-head">
          <strong id="dialogueName"></strong>
          <span id="dialogueProgress"></span>
        </div>
        <p id="dialogueText"></p>
        <button id="dialogueNext" type="button"><span>Space／E</span> 下一句</button>
      </div>
    </div>
    <!-- 建築快捷欄與完整清單：浮在遊戲畫面左下角 -->
    <div id="buildToolbar">
      <button class="tbtn" id="demolishToggle" type="button" title="點擊後，再點選自己建造的建築"><span class="build-tool-icon" aria-hidden="true">🔨</span><span>拆除</span></button>
      <button class="tbtn" id="buildToggle" type="button"><span class="build-tool-icon" aria-hidden="true">🧱</span><span>更多建築</span></button>
      <div id="buildQuickSlots" aria-label="建築快捷欄"></div>
    </div>
    <div id="buildbar" class="hidden"></div>
    <div id="npcArrangeToolbar" class="hidden">
      <button class="tbtn" id="npcArrangeToggle" type="button" aria-pressed="false">移動 NPC</button>
      <span id="npcArrangeHint" class="hidden">拖曳角色到空地，放開後正面朝向鏡頭</span>
    </div>
    <div id="elevatorMenu" class="hidden" role="dialog" aria-modal="true" aria-labelledby="elevatorTitle">
      <div class="elevator-card">
        <button id="elevatorClose" type="button" aria-label="關閉樓層選單">×</button>
        <h2 id="elevatorTitle">搭電梯</h2>
        <p id="elevatorMessage">選擇要前往的樓層</p>
        <div class="elevator-floors">
          <button type="button" data-floor="1F">1F</button>
          <button type="button" data-floor="3F">3F</button>
          <button type="button" data-floor="4F">4F</button>
          <button type="button" data-floor="B-4F">B-4F</button>
        </div>
      </div>
    </div>
  </div>

  <div id="hud" aria-label="戰鬥資訊">
    <div class="hud-player" aria-label="溫特狀態">
      <span class="hud-player-avatar"><img src="images/character/winter_B/winterB_0000_Front.png" alt="溫特"></span>
      <div class="hud-player-status">
        <b>溫特．嚮導部隊長</b>
        <div class="hud-player-bar hp" role="meter" aria-label="溫特 HP" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><i id="playerHpBar"></i></div>
        <div class="hud-player-bar energy" role="meter" aria-label="精神能量" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><i id="playerEnergyBar"></i></div>
      </div>
    </div>
    <span class="stat money"><small>經費</small><b id="money">0</b></span>
    <span class="stat crystal"><small>異質碎片</small><b id="crystals">0</b></span>
  </div>

  <div id="editors">
    <a href="地圖編輯器.html">🗺️ 地圖編輯器</a>
    <a href="物件編輯器.html">🧱 物件編輯器</a>
    <a href="怪物編輯器.html">🐾 怪物編輯器</a>
    <a href="角色資料頁.html">🪪 角色資料頁</a>
    <a href="對話編輯器.html">💬 對話編輯器</a>
    <a href="椅子編輯器.html">🪑 椅子編輯器</a>
  </div>

  <!-- ===== 程式檔案，順序很重要，要由上往下依序載入 ===== -->
  <script src="js/config.js"></script>       <!-- 1. 格線與座標設定 -->
  <script src="js/sfx.js?v=boom-sfx-20261007"></script>          <!-- 1b. 音效 -->
  <script src="js/ui-feedback.js"></script> <!-- 共用按鈕與切換回饋 -->

  <script src="data/characters.js?v=taint-rates-20261007"></script>  <!-- 集中管理所有角色 -->
  <script src="data/dialogues.js?v=dlg-20261006"></script>  <!-- 所有台詞（對話編輯器） -->
  <script src="data/balance.js?v=dlg-20261006"></script>    <!-- 2. 遊戲數值（最常調整） -->
  <script src="js/dialogue-data.js?v=dlg-20261006"></script>
  <script src="data/monsters.js"></script>  <!-- 2b. 怪物種類與數值 -->
  <script src="js/monster-data.js"></script>
  <script src="data/objects.js?v=mine-20261007"></script>    <!-- 3. 障礙物外觀與碰撞範圍 -->
  <script src="data/decorations.js?v=oil-20261007"></script><!-- 3b. 裝飾物件（低HP、可佈置） -->
  <script src="data/maps.js?v=merge-20261007"></script>       <!-- 4. 地圖資料（地圖編輯器匯出） -->
  <script src="data/chairs.js?v=foldchair-20261005"></script> <!-- 可互動椅子的坐姿、深度與碰撞 -->
  <script src="js/chair-data.js"></script>
  <script src="data/elevators.js?v=passage-20261002"></script> <!-- 電梯開關門的擋路格與遮擋深度 -->
  <script src="js/elevator-data.js"></script>
  <script src="js/pathfinding.js"></script>  <!-- 5. 固定牆與怪物尋路 -->
  <script src="js/maploader.js?v=merge-20261007"></script>    <!-- 6. 把編輯器地圖接進遊戲 -->
  <script src="js/lighting.js?v=core-20261006"></script>     <!-- 7. 黑暗與光源系統 -->
  <script src="js/build.js?v=mine-20261007"></script>        <!-- 8. 建築系統（放置/選單/動畫） -->
  <script src="js/team.js?v=soothe-20261003"></script>         <!-- 8b. 出勤隊伍（編隊面板／登場名單） -->
  <script src="js/sentry.js?v=merge-20261007"></script>       <!-- 9. 哨兵系統（巡邏AI/選單） -->
  <script src="js/progression.js?v=core-20261006"></script>
  <script src="js/anomalous-core.js?v=corebar-20261006"></script> <!-- 異質核心：沉睡／甦醒／兩階段召喚／碎裂 -->
  <script src="js/combat-feel.js?v=mine-20261007"></script> <!-- 9b. 戰鬥表演：史萊姆變體、受擊回饋、死亡表演 -->
  <script src="js/achievements.js?v=spitter-20261006"></script> <!-- 9d. 成就系統：累計戰績、右下角彈出通知 -->
  <script src="js/berserk-fx.js?v=dlg-20261006"></script> <!-- 9c. 暴走表演：瀕臨暴走黑霧、暴走瞬間、疏導吹散 -->
  <script src="js/enemy-ai.js?v=merge-20261007"></script> <!-- 9f. 怪物 AI：尋路、感知、攻擊、史萊姆跳躍 -->
  <script src="js/render.js?v=merge-20261007"></script> <!-- 9g. 繪圖：各種角色物件的畫法與每幀繪製 -->
  <script src="js/attack-fx.js?v=boom-sfx-20261007"></script> <!-- 9e. 攻擊特效：打擊感、火焰／雷電／揮砍／腐蝕／槍擊 -->
  <script src="js/oil-barrels.js?v=boom-sfx-20261007"></script> <!-- 9h. 油桶／油箱：爆炸、漏油、燃燒 -->
  <script src="js/landmine.js?v=mine2-20261007"></script> <!-- 9i. 地雷：怪物踩到爆炸 -->
  <script src="js/game.js?v=merge-20261007"></script>         <!-- 10. 遊戲主邏輯（啟動遊戲，必須最後） -->
</body>
</html>
