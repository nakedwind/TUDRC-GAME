<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台北地下災害應變中心 — 塔防原型</title>
<!-- 樣式（畫面外觀）放在獨立檔案 -->
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="wrap">
    <canvas id="cv" width="1280" height="720"></canvas>
    <div id="screenShade"></div>

    <div id="missionText">目前任務：守住營地</div>

    <!-- HUD 疊在遊戲畫面右上角 -->
    <div id="hud">
      <span class="stat money"><small>資源</small><b id="money">0</b></span>
      <span class="stat hp"><small>營地 HP</small><b id="lives">0</b></span>
      <span class="stat guide"><small>嚮導能量</small><b id="guide">0</b></span>
      <span class="stat wave"><small>核心清除</small><b><span id="wave">0</span>/<span id="wavemax">0</span></b></span>
    </div>

    <div id="overlay">
      <div class="overlay-card">
        <div class="panel-kicker">緊急簡報</div>
        <h2 id="ov-title">塔防原型</h2>
        <p id="ov-text"></p>
        <div id="mapPickRow" class="hidden" style="margin-top:10px;font-size:15px;color:#cfd8e3">
          🗺️ 選擇地圖：<select id="mapPick" style="font-size:15px;padding:6px 10px;border-radius:6px;background:#232a35;color:#e6ebf2;border:1px solid #4f8fbf"></select>
        </div>
      </div>
      <button id="ov-btn">開始</button>
    </div>
    <!-- 哨兵選單（點哨兵時彈出，內容由 game.js 產生） -->
    <div id="sentryMenu" class="hidden"></div>
    <!-- 地面情境選單（點空地時彈出） -->
    <div id="groundMenu" class="hidden"></div>
    <!-- NPC 正式對話框（靠近角色按 Space／E） -->
    <div id="dialogueBox" class="hidden" role="dialog" aria-live="polite">
      <button id="dialogueClose" type="button" aria-label="關閉對話">×</button>
      <img id="dialoguePortrait" alt="角色頭像">
      <div class="dialogue-content">
        <div class="dialogue-head">
          <strong id="dialogueName"></strong>
          <span id="dialogueProgress"></span>
        </div>
        <p id="dialogueText"></p>
        <button id="dialogueNext" type="button"><span>Space／E</span> 下一句</button>
      </div>
    </div>
    <!-- 建築按鈕與選單：浮在遊戲畫面左下角 -->
    <button class="tbtn" id="buildToggle">🧱 建築</button>
    <div id="buildbar" class="hidden"></div>
  </div>

  <div id="editors">
    <a href="地圖編輯器.html">🗺️ 地圖編輯器</a>
    <a href="物件編輯器.html">🧱 物件編輯器</a>
  </div>

  <!-- ===== 程式檔案，順序很重要，要由上往下依序載入 ===== -->
  <script src="js/config.js"></script>       <!-- 1. 格線與座標設定 -->
  <script src="js/sfx.js"></script>          <!-- 1b. 音效 -->

  <script src="data/balance.js"></script>    <!-- 2. 遊戲數值（最常調整） -->
  <script src="data/objects.js"></script>    <!-- 3. 障礙物外觀與碰撞範圍 -->
  <script src="data/decorations.js"></script><!-- 3b. 裝飾物件（低HP、可佈置） -->
  <script src="data/maps.js"></script>       <!-- 4. 地圖資料（地圖編輯器匯出） -->
  <script src="js/pathfinding.js"></script>  <!-- 5. 固定牆與怪物尋路 -->
  <script src="js/maploader.js"></script>    <!-- 6. 把編輯器地圖接進遊戲 -->
  <script src="js/lighting.js"></script>     <!-- 7. 黑暗與光源系統 -->
  <script src="js/build.js"></script>        <!-- 8. 建築系統（放置/選單/動畫） -->
  <script src="js/team.js"></script>         <!-- 8b. 出勤隊伍（編隊面板／登場名單） -->
  <script src="js/sentry.js"></script>       <!-- 9. 哨兵系統（巡邏AI/選單） -->
  <script src="js/progression.js"></script>
  <script src="js/game.js"></script>         <!-- 10. 遊戲主邏輯（啟動遊戲，必須最後） -->
</body>
</html>
