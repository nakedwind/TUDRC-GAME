<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- 送禮：禮物盒＋蝴蝶結（緞帶縫挖空），白色剪影；風格跟艾德林的任務板一樣（粗圓、白色實心） -->
  <defs>
    <mask id="giftCut">
      <!-- 蝴蝶結左右兩個圈 -->
      <path d="M12 7.6C10.2 3.6 5.6 2.8 5.6 5.4C5.6 7.2 8.6 7.8 12 7.6Z" fill="#fff"/>
      <path d="M12 7.6C13.8 3.6 18.4 2.8 18.4 5.4C18.4 7.2 15.4 7.8 12 7.6Z" fill="#fff"/>
      <!-- 盒蓋、盒身 -->
      <rect x="2.6" y="7.6" width="18.8" height="4.6" rx="1.4" fill="#fff"/>
      <rect x="4" y="12" width="16" height="9.8" rx="1.6" fill="#fff"/>
      <!-- 盒蓋和盒身之間的縫、中間直的緞帶縫（挖空） -->
      <rect x="2" y="12.2" width="20" height="1.2" fill="#000"/>
      <rect x="10.1" y="7.6" width="1.1" height="15" fill="#000"/>
      <rect x="12.8" y="7.6" width="1.1" height="15" fill="#000"/>
    </mask>
  </defs>
  <rect width="24" height="24" fill="#fff" mask="url(#giftCut)"/>
</svg>
