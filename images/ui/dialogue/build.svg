<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- 開發建築物：一面磚牆（磚縫挖空，一排一排錯開），白色剪影 -->
  <defs>
    <mask id="brickCut">
      <rect x="2.2" y="3.4" width="19.6" height="17.2" rx="2.6" fill="#fff"/>
      <!-- 橫的磚縫 -->
      <rect x="1" y="7.5" width="22" height="1.3" fill="#000"/>
      <rect x="1" y="11.6" width="22" height="1.3" fill="#000"/>
      <rect x="1" y="15.7" width="22" height="1.3" fill="#000"/>
      <!-- 直的磚縫（每一排錯開） -->
      <rect x="11.35" y="3" width="1.3" height="4.6" fill="#000"/>
      <rect x="6.6" y="8.7" width="1.3" height="3" fill="#000"/>
      <rect x="16.1" y="8.7" width="1.3" height="3" fill="#000"/>
      <rect x="11.35" y="12.8" width="1.3" height="3" fill="#000"/>
      <rect x="6.6" y="16.9" width="1.3" height="4" fill="#000"/>
      <rect x="16.1" y="16.9" width="1.3" height="4" fill="#000"/>
    </mask>
  </defs>
  <rect width="24" height="24" fill="#fff" mask="url(#brickCut)"/>
</svg>
