<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- 製作裝備：鐵鎚和扳手交叉，白色剪影 -->
  <defs>
    <mask id="makeCut">
      <!-- 扳手（左下到右上） -->
      <g transform="rotate(-45 12 12)">
        <rect x="3" y="10.4" width="13" height="3.2" rx="1.6" fill="#fff"/>
        <circle cx="17.6" cy="12" r="4.4" fill="#fff"/>
        <rect x="17.4" y="10.6" width="5" height="2.8" rx="1.2" fill="#000"/>
      </g>
      <!-- 鐵鎚（右下到左上），蓋在扳手上面，邊緣留一圈黑縫分開 -->
      <g transform="rotate(45 12 12)">
        <rect x="6.4" y="9.6" width="14.4" height="4.8" rx="2.4" fill="#000"/>
        <rect x="7.2" y="10.4" width="13" height="3.2" rx="1.6" fill="#fff"/>
        <rect x="1.4" y="6.4" width="7.4" height="11.2" rx="2" fill="#000"/>
        <rect x="2.2" y="7.2" width="5.8" height="9.6" rx="1.6" fill="#fff"/>
      </g>
    </mask>
  </defs>
  <rect width="24" height="24" fill="#fff" mask="url(#makeCut)"/>
</svg>
