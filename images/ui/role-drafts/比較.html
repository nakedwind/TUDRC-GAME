<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>哨兵／嚮導圖示草稿</title>
<style>
body{margin:0;padding:20px;background:#3b4350;color:#eef3fa;font-family:"Microsoft JhengHei",sans-serif}
h2{margin:18px 0 8px;font-size:16px;color:#ffd479}
.row{display:flex;gap:16px;flex-wrap:wrap}
.card{background:#262d38;border-radius:12px;padding:12px 14px;text-align:center;width:150px}
.big{width:72px;height:72px}
.name{margin-top:10px;display:flex;justify-content:center;align-items:center;gap:3px;font:bold 22px sans-serif;color:#fff;
  -webkit-text-stroke:5px rgba(0,0,0,.9);paint-order:stroke fill}
.name img{width:24px;height:24px;filter:drop-shadow(1.5px 0 0 #000) drop-shadow(-1.5px 0 0 #000) drop-shadow(0 1.5px 0 #000) drop-shadow(0 -1.5px 0 #000)}
.tiny{margin-top:6px;font:bold 11px sans-serif;display:flex;justify-content:center;align-items:center;gap:2px;-webkit-text-stroke:3px #000;paint-order:stroke fill}
.tiny img{width:12px;height:12px;filter:drop-shadow(1px 0 0 #000) drop-shadow(-1px 0 0 #000) drop-shadow(0 1px 0 #000) drop-shadow(0 -1px 0 #000)}
small{display:block;margin-top:6px;color:#9fb0c2;font-size:12px}
</style></head><body>
<h2>決定版</h2><div class="row"><div class="card"><img class="big" src="../sentinel-swords.svg"><div class="name"><img src="../sentinel-swords.svg">雷德</div><div class="tiny"><img src="../sentinel-swords.svg">雷德</div><small>哨兵：交叉雙劍</small></div><div class="card"><img class="big" src="../guide-shield-plus.svg"><div class="name"><img src="../guide-shield-plus.svg">艾德林</div><div class="tiny"><img src="../guide-shield-plus.svg">艾德林</div><small>嚮導：盾牌＋十字</small></div></div>
<h2>哨兵</h2><div class="row">
<div class="card"><img class="big" src="sentinel-shield.svg"><div class="name"><img src="sentinel-shield.svg">雷德</div><div class="tiny"><img src="sentinel-shield.svg">雷德</div><small>S1 盾牌（推薦）</small></div>
<div class="card"><img class="big" src="sentinel-badge.svg"><div class="name"><img src="sentinel-badge.svg">雷德</div><div class="tiny"><img src="sentinel-badge.svg">雷德</div><small>S2 星章盾牌</small></div>
<div class="card"><img class="big" src="sentinel-swords.svg"><div class="name"><img src="sentinel-swords.svg">雷德</div><div class="tiny"><img src="sentinel-swords.svg">雷德</div><small>S3 交叉雙劍</small></div>
</div>
<h2>嚮導</h2><div class="row">
<div class="card"><img class="big" src="guide-heart-wave.svg"><div class="name"><img src="guide-heart-wave.svg">艾德林</div><div class="tiny"><img src="guide-heart-wave.svg">艾德林</div><small>G1 愛心＋疏導波紋（推薦）</small></div>
<div class="card"><img class="big" src="guide-heart.svg"><div class="name"><img src="guide-heart.svg">艾德林</div><div class="tiny"><img src="guide-heart.svg">艾德林</div><small>G2 圓胖愛心</small></div>
<div class="card"><img class="big" src="guide-compass.svg"><div class="name"><img src="guide-compass.svg">艾德林</div><div class="tiny"><img src="guide-compass.svg">艾德林</div><small>G3 羅盤（指引）</small></div>
</div>
<h2>跟功能 NPC 放在一起</h2><div class="row">
<div class="card" style="width:auto"><div class="name" style="gap:14px">
<span><img src="../noah-wrench.svg">諾亞</span><span><img src="../ash-clipboard.svg">亞許</span><span><img src="../taana-whistle.svg">塔納</span><span><img src="sentinel-shield.svg">雷德</span><span><img src="guide-heart-wave.svg">艾德林</span></div></div>
</div></body></html>
