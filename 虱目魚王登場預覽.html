<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>虱目魚王登場預覽</title>
<style>
  /* 跟其他編輯器一樣的深色畫面 */
  :root { --bg: #14181f; --panel: #1d222b; --line: #333c49; --text: #dfe6ef; --dim: #9fb0c3; --accent: #8fc8ff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, "Noto Sans TC", sans-serif; display: flex; flex-direction: column; }
  header { padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  h1 { font-size: 16px; margin: 0 8px 0 0; }
  button { background: #2a3140; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 14px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button.main { background: #2d5a8a; border-color: #4f8fd0; font-weight: 600; }
  label { display: inline-flex; align-items: center; gap: 4px; color: var(--dim); cursor: pointer; }
  select { background: #2a3140; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; font: inherit; }
  #status { color: var(--accent); }
  #values { width: 100%; color: var(--dim); font-size: 12px; }
  #game { flex: 1; width: 100%; border: 0; background: #000; }
</style>
</head>
<body>
<header>
  <h1>👑 虱目魚王登場預覽</h1>
  <button id="play" class="main" type="button">▶ 播放登場</button>
  <button id="pause" type="button" disabled>⏸ 暫停</button>
  <label>速度
    <select id="speed">
      <option value="1">正常</option>
      <option value="0.5">慢動作 ½</option>
      <option value="0.25">慢動作 ¼</option>
    </select>
  </label>
  <label><input id="bright" type="checkbox" checked> 關掉黑暗（看清楚）</label>
  <label><input id="noBanner" type="checkbox" checked> 隱藏中間橫幅</label>
  <label><input id="sound" type="checkbox"> 聲音</label>
  <span id="status">按「播放登場」開始（第一次要載入遊戲，約 5～10 秒）</span>
  <div id="values"></div>
</header>
<iframe id="game" title="虱目魚王登場預覽的遊戲畫面"></iframe>
<script>
  /* 做法：把真正的遊戲（塔防原型.html）開在下面的框裡，用遊戲自己的畫面程式播，不另外做一版。
     每按一次「播放登場」：開 G11（測試模式）→ 重新開一場 → 溫特站到水池和原位中間 → 照「溫特開槍打到核心」觸發登場。
     不會動到存檔：遊戲頁在載入前先加一小段程式，所有存檔都只寫在記憶體裡，關掉這頁就消失（用哪個伺服器打開都一樣）。
     登場的秒數、高度、震動大小在怪物編輯器「虱目魚王」的「登場：」那幾格改（這頁只負責播放）。 */
  const G11 = 'map_mwm655e8';
  const $ = id => document.getElementById(id);
  const frame = $('game');
  let win = null, loading = null, paused = false;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const run = code => win.eval(code);   // 在遊戲框裡執行（才拿得到遊戲裡的 G、MAP 這些）
  const status = t => { $('status').textContent = t; };

  // 加在遊戲頁最前面：存檔（localStorage、sessionStorage）只寫在記憶體，讀的時候先看記憶體、沒有才讀瀏覽器原本的
  const NO_SAVE = `<script>(function(){
    var S = Storage.prototype, get = S.getItem, mem = new WeakMap();
    function box(s){ var m = mem.get(s); if (!m) { m = new Map(); mem.set(s, m); } return m; }
    S.setItem = function(k, v){ box(this).set(String(k), String(v)); };
    S.removeItem = function(k){ box(this).set(String(k), null); };
    S.clear = function(){ var m = box(this); for (var i = 0; i < this.length; i++) m.set(this.key(i), null); };
    S.getItem = function(k){ var m = box(this); k = String(k); return m.has(k) ? m.get(k) : get.call(this, k); };
    window.TEST_MODE = true;
  })();<\/script>`;

  async function loadGame() {
    status('載入遊戲中…');
    const html = await fetch('塔防原型.html?introPreview=' + Date.now()).then(r => r.text());
    const base = '<base href="' + new URL('./', location.href).href + '">';
    const doc = html.replace(/<head([^>]*)>/i, m => m + base + NO_SAVE);
    await new Promise(res => { frame.onload = res; frame.srcdoc = doc; });
    win = frame.contentWindow;
    for (let i = 0; i < 160 && !(win.switchMap && win.begin && win.mapIndexById); i++) await wait(250);
    if (!win.switchMap) throw new Error('遊戲載入失敗');
    // 等圖片載完
    for (let i = 0; i < 120 && run("typeof AssetGate !== 'undefined' && AssetGate.blocking()"); i++) await wait(250);
    // 讀到真正存檔裡暫停中的戰場也不要用：每次都重新開一場；任務經費、飯後加成這些也不要記
    run(`restoreCombatProgress = () => false; restoreSlotScene = () => false;
         if (typeof markMissionMapReached === 'function') markMissionMapReached = () => {};
         if (typeof fundCardDue === 'function') fundCardDue = () => false;
         // 速度：遊戲每一幀的時間乘上倍數（0＝暫停）
         // 鏡頭：有指定對準的點就對準那裡（只有這個預覽頁會這樣，遊戲本身照舊跟著溫特）
         if (!window.__mkOrigCam) { window.__mkOrigCam = updateCamera; updateCamera = function () {
           const f = window.__mkCamFocus; if (!f) return __mkOrigCam();
           cam.x = Math.max(0, Math.min(COLS * CELL - viewW(), f.x - viewW() / 2)); cam.y = Math.max(0, Math.min(ROWS * CELL - viewH(), f.y - viewH() / 2)); }; }
         if (!window.__mkOrigUpdate) { window.__mkOrigUpdate = update; update = function (dt) { return __mkOrigUpdate(dt * (window.__mkSpeed ?? 1)); }; }`);
  }

  async function play() {
    $('play').disabled = true;
    try {
      if (!win) { loading = loadGame(); await loading; }
      status('準備 G11…');
      applySound(); applySpeed();
      run(`window.TEST_MODE = true;
           if (!MAP || MAP.id !== '${G11}') switchMap(mapIndexById('${G11}'));`);
      await wait(800);
      run('begin(false)');
      for (let i = 0; i < 40 && !run('!!(G && G.mkIntro)'); i++) await wait(150);
      if (!run('!!(G && G.mkIntro)')) throw new Error('這張地圖沒有虱目魚王的水池登場（MILKFISH_KING_MAPS 的 intro）');
      run(`G.player.hp = G.player.maxhp = 1e9;           // 溫特不會死
           G.cores.forEach(c => { c.timer = 1e9; });     // 核心先不召喚小怪，畫面乾淨
           G.enemies.length = 0;                         // 地圖上本來就有的小怪也先清掉（虱目魚王這時還躲在水裡，不在這裡面）
           for (const t of G.towers) t.frozenT = 999;     // 隊員站著不動、不搶鏡頭
           // 鏡頭對準整段動作的中間（水池和原位中間、往上抬到牠跳起來的高度）；溫特站到下面不擋畫面
           { const I = G.mkIntro, e = I.e, x = (I.from.x + I.to.x) / 2, y = Math.max(I.from.y, I.to.y) + CELL * 2.5;
             window.__mkCamFocus = { x, y: (I.from.y + I.to.y) / 2 - (mkCfg(e).introLeapHeight + (e.drawHeight || 240)) / 2 + 30 };
             const spot = mkFreeCellNear(x, y); if (spot) { const [px, py] = center(spot[0], spot[1]); G.player.x = px; G.player.y = py; }
             G.player.facing = 'right'; }
           G.coreBanner = null;`);
      applyBright();
      showValues();
      await wait(300);
      // 跟遊戲裡一樣：溫特開槍打到核心 → 叫醒核心 → 虱目魚王開始登場
      run(`{ const core = G.mkIntro.e.mk.core; wakeCore(core); core.lastHp = core.hp; milkfishKingCoreShot(core); }`);
      paused = false; $('pause').disabled = false; $('pause').textContent = '⏸ 暫停'; applySpeed();
      status('播放中…（可以再按一次重播）');
      watchEnd();
    } catch (e) {
      status('出錯了：' + (e && e.message || e));
    }
    $('play').disabled = false; $('play').textContent = '↻ 重播登場';
  }
  // 登場結束（落地、吞完核心）時更新文字
  let watchId = 0;
  async function watchEnd() {
    const id = ++watchId;
    const hideBanner = () => { if ($('noBanner').checked) run('G.coreBanner = null'); };   // 「核心甦醒了」「虱目魚王甦醒了」的大橫幅會擋住畫面
    while (id === watchId && win && run('!!(G && G.mkIntro)')) { hideBanner(); await wait(100); }
    if (id !== watchId) return;
    status('落地了！牠會去吞核心，接著開始戰鬥（再按「重播登場」重來）');
    for (let i = 0; i < 30 && id === watchId; i++) { hideBanner(); await wait(100); }   // 落地後的吼叫橫幅也收掉
  }
  function showValues() {
    const v = run(`(() => { const c = mkCfg(G.mkIntro.e); return [c.introRumble, c.introShake, c.introLeapTime, c.introLeapHeight, c.introLandShake]; })()`);
    $('values').textContent = '目前數值：竄出前震動 ' + v[0] + ' 秒、震動大小 ' + v[1] + '、在空中 ' + v[2] + ' 秒、跳 ' + v[3] + ' 像素高、落地震動 ' + v[4] + '（在怪物編輯器「虱目魚王」的「登場：」改，存檔後按重播就會用新的）';
  }
  function applySpeed() { if (win) run('window.__mkSpeed = ' + (paused ? 0 : Number($('speed').value))); }
  function applyBright() { if (win && run('typeof LIGHT !== "undefined"')) run('LIGHT.enabled = ' + !$('bright').checked); }
  function applySound() { if (win) run('try { Howler.mute(' + !$('sound').checked + '); } catch (_) {}'); }

  $('play').addEventListener('click', play);
  $('pause').addEventListener('click', () => { paused = !paused; $('pause').textContent = paused ? '▶ 繼續' : '⏸ 暫停'; applySpeed(); });
  $('speed').addEventListener('change', applySpeed);
  $('bright').addEventListener('change', applyBright);
  $('sound').addEventListener('change', applySound);
</script>
</body>
</html>
